            // 日志函数
            function log(message, data = null) {
                if (CONFIG.DEBUG) {
                    console.log(`[Redirect] ${message}`, data || '');
                }
            }

            // 提取 token 参数
            function extractToken(hash) {
                if (!hash || typeof hash !== 'string') {
                    return null;
                }

                log('Processing hash:', hash);

                // 匹配 token 参数
                const tokenMatch = hash.match(/token=([^&]*)/);
                if (tokenMatch && tokenMatch[1]) {
                    return decodeURIComponent(tokenMatch[1]);
                }

                return null;
            }

            // 检查 token 是否在映射表中，并返回对应的目标 token
            function getTargetToken(sourceToken) {
                return TOKEN_MAP[sourceToken] || null;
            }

            // 构建目标 URL
            function buildTargetUrl(token) {
                const encodedToken = encodeURIComponent(token);
                return `${CONFIG.TARGET_DOMAIN}${CONFIG.TARGET_PATH}?token=${encodedToken}`;
            }

            // 主要重定向逻辑
            function handleRedirect() {
                try {
                    // 获取当前页面的 hash
                    const hash = window.location.hash;
                    log('Current URL hash:', hash);

                    // 提取 token
                    const sourceToken = extractToken(hash);
                    if (!sourceToken) {
                        log('No token found in hash, ignoring');
                        return;
                    }

                    log('Source token extracted:', sourceToken.substring(0, 20) + '...');

                    // 检查 token 是否在映射表中
                    const targetToken = getTargetToken(sourceToken);
                    if (!targetToken) {
                        log('Token not found in mapping table, ignoring');
                        return;
                    }

                    log('Target token found:', targetToken.substring(0, 20) + '...');

                    // 构建目标 URL
                    const targetUrl = buildTargetUrl(targetToken);
                    log('Target URL built:', targetUrl);

                    // 立即执行重定向
                    window.location.href = targetUrl;

                } catch (error) {
                    log('Error occurred:', error.message);
                    // 静默忽略错误
                }
            }

            // 立即执行重定向
            handleRedirect();

        })();
    </script>

    <style>
        .first-loading-wrp {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 420px;
            height: 100%;
        }

        .first-loading-wrp .loading-wrp {
            padding: 98px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dot {
            animation: antRotate 1.2s infinite linear;
            transform: rotate(45deg);
            position: relative;
            display: inline-block;
            font-size: 32px;
            width: 32px;
            height: 32px;
            box-sizing: border-box;
        }

        .dot i {
            width: 14px;
            height: 14px;
            position: absolute;
            display: block;
            background-color: #ffbe00;
            border-radius: 100%;
            transform: scale(0.75);
            transform-origin: 50% 50%;
            opacity: 0.3;
            animation: antSpinMove 1s infinite linear alternate;
        }

        .dot i:nth-child(1) {
            top: 0;
            left: 0;
        }

        .dot i:nth-child(2) {
            top: 0;
            right: 0;
            animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
            right: 0;
            bottom: 0;
            animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
            bottom: 0;
            left: 0;
            animation-delay: 1.2s;
        }

        @keyframes antRotate {
            to {
                transform: rotate(405deg);
            }
        }

        @keyframes antSpinMove {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

            </div>
        </div>
    </div>
