# TTPOS SonarQube Configuration
# ==============================
# Run: sonar-scanner -Dsonar.login=$SONAR_TOKEN

# Project identification
sonar.projectKey=ttpos-server-go
sonar.projectName=TTPOS Server Go
sonar.projectVersion=1.0

# Source code locations
sonar.sources=main,ttpos-bmp
sonar.tests=main,ttpos-bmp

# Test file patterns
sonar.test.inclusions=**/*_test.go

# Exclusions
# - Generated code (dao, entity, do, service, pb, packed)
# - Test utilities (testlib, tests/)
# - Configuration files
sonar.coverage.exclusions=\
  **/dao/**,\
  **/entity/**,\
  **/do/**,\
  **/pb/**,\
  **/packed/**,\
  **/testlib/**,\
  **/tests/**,\
  **/config/**,\
  **/dto/**,\
  **/model/**,\
  **/*_gen.go

sonar.exclusions=\
  **/testlib/**,\
  **/tests/**,\
  **/docs/**,\
  **/manifest/**,\
  **/*.md,\
  **/*.sql

# Go specific settings
# Note: Use sonar.go.coverage.reportPaths for native Go coverage format (not sonar.coverageReportPaths which expects XML)
sonar.go.coverage.reportPaths=coverage/total.out,coverage/bmp-total.out

# Encoding
sonar.sourceEncoding=UTF-8

# Skip SSL certificate verification (for self-signed certs)
sonar.scanner.skipSystemTruststore=true
sonar.scanner.trustAllCertificates=true

# Analysis scope
sonar.scm.revision=${GIT_COMMIT}
sonar.scm.provider=git

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplication
sonar.cpd.exclusions=\
  **/dto/**,\
  **/model/**,\
  **/entity/**,\
  **/do/**,\
  **/dao/**,\
  **/packed/**

# Go test report (if using gotestsum)
# sonar.go.tests.reportPaths=test-report.json
