name: CI

on:
  push:
    branches: [main, develop, 'release/*', 'feature/*']
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'

jobs:
  # ===========================================
  # Unit Tests
  # ===========================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: main/go.sum

      - name: Run unit tests
        working-directory: main
        run: |
          go test -v -count=1 -coverprofile=../coverage/unit.out -covermode=set ./...

      - name: Fix coverage paths for SonarQube
        run: bash main/tests/fix-coverage-paths.sh coverage/unit.out

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit.out
          retention-days: 7

  # ===========================================
  # Lint & Vet
  # ===========================================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: main/go.sum

      - name: Run go vet
        working-directory: main
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: main

  # ===========================================
  # Integration Tests
  # ===========================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: main/go.sum

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: hub.hitosea.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run integration tests
        run: |
          make test-local BUILD_ID="${GITHUB_RUN_ID}"

      - name: Fix coverage paths for SonarQube
        if: always()
        run: bash main/tests/fix-coverage-paths.sh coverage/total.out

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/total.out
          retention-days: 7

  # ===========================================
  # SonarQube Analysis
  # ===========================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    if: always() && (needs.unit-test.result == 'success' || needs.integration-test.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
        continue-on-error: true

      - name: Download integration coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: coverage/
        continue-on-error: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Merge coverage reports
        run: |
          mkdir -p coverage/merge
          # Copy available coverage files into merge directory for go tool covdata
          for f in coverage/unit.out coverage/total.out; do
            if [ -f "$f" ]; then
              cp "$f" "coverage/merge/$(basename "$f")"
            fi
          done
          # Merge using gocovmerge (handles text format .out files)
          if ls coverage/merge/*.out 1>/dev/null 2>&1; then
            MERGE_FILES=$(ls coverage/merge/*.out)
            COUNT=$(echo "$MERGE_FILES" | wc -l)
            if [ "$COUNT" -gt 1 ]; then
              go install github.com/wadey/gocovmerge@v0.0.0-20160331181800-b5bfa59ec0ad
              gocovmerge $MERGE_FILES > coverage/final.out
            else
              cp $MERGE_FILES coverage/final.out
            fi
          fi
          rm -rf coverage/merge

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dproject.settings=main/tests/sonar-project.properties
            -Dsonar.go.coverage.reportPaths=coverage/final.out
            -Dsonar.scm.revision=${{ github.sha }}

  # ===========================================
  # Build Docker Image (main/release only)
  # ===========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-test, lint, integration-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: hub.hitosea.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hub.hitosea.com/ttpos-server/ttpos-server-go
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: main/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
