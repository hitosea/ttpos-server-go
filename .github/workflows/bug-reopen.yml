name: Bug Reopen Handler

on:
  issues:
    types: [reopened]

jobs:
  handle-reopen:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Remove closed/verified labels, add reopened label
            const labelsToRemove = ['status:closed', 'status:verified'];
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label,
                });
              } catch (e) {
                // Label might not exist, ignore
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['status:reopened'],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '**Bug reopened** — the previous fix did not resolve this issue.',
                '',
                'Please update with:',
                '- What still fails after the merged fix',
                '- Any new evidence (screenshots, logs)',
                '',
                'Then re-assign to the developer for another fix cycle.',
              ].join('\n'),
            });
