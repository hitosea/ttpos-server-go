name: Go Build & Docker Push New

env:
  CGO_ENABLED: 0
  # Docker镜像配置
  REGISTRY: hub.hitosea.com
  IMAGE_NAME: ttpos-server


on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: "branch (e.g., release)"
        required: true
        type: choice
        options:
          - "test"
          - "release"


jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        program: [ main,websocket,redis-proxy ]
    env:
      BRANCH: ${{ github.event_name == 'push' && github.ref || github.event.inputs.branch }}
      
    steps:
      - name: 设置 IMAGE_TAG
        id: set_image_tag
        run: |
          if [ "${BRANCH}" = "release" ] || [ "${BRANCH}" = "refs/heads/release" ]; then
            echo "IMAGE_TAG_PREFIX=" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG_PREFIX=test-" >> $GITHUB_ENV
          fi
 
        
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Echo Commit_id
        id: build
        run: |
          echo "COMMIT_ID=$(git log -1 --pretty=format:%h -- .)" >> $GITHUB_OUTPUT

      #环境
      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Nginx image
        id: build-nginx
        if: ${{ matrix.program == 'main' }}
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./admin
          file: ./admin/Dockerfile-views
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ttpos-server-nginx:${{ env.IMAGE_TAG_PREFIX }}${{steps.build.outputs.COMMIT_ID }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ttpos-server-nginx:${{ env.IMAGE_TAG_PREFIX }}latest
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./${{ matrix.program }}
          file: ./${{ matrix.program }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ttpos-server-${{ matrix.program == 'main' &&  'go' || matrix.program }}:${{ env.IMAGE_TAG_PREFIX }}${{steps.build.outputs.COMMIT_ID }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ttpos-server-${{ matrix.program == 'main' &&  'go' || matrix.program }}:${{ env.IMAGE_TAG_PREFIX }}latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

