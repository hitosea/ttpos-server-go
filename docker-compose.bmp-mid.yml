version: '3'
#中台中间件
services:
  nacos:
    image: nacos/nacos-server:v3.0.2
    container_name: "bmp-nacos-${APP_ID}"
    env_file:
      - .env
    environment:
      - MODE=standalone
      - NACOS_AUTH_TOKEN="${NACOS_AUTH_TOKEN}"
      - NACOS_AUTH_IDENTITY_KEY="${NACOS_AUTH_IDENTITY_KEY}"
      - NACOS_AUTH_IDENTITY_VALUE="${NACOS_AUTH_IDENTITY_VALUE}"
    ports:
      - "${NACOS_CONSOLE_PORT:-18080}:8080"
      - "${NACOS_SERVER_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    networks:
      bmp-mid-network:
        ipv4_address: 10.0.11.10

  #rocketmq 服务
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    networks:
      bmp-mid-network:
          ipv4_address: 10.0.11.40
    command: sh mqnamesrv
  broker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - namesrv
    networks:
      bmp-mid-network:
        ipv4_address: 10.0.11.41
    command: sh mqbroker
  proxy:
    image: apache/rocketmq:5.3.2
    container_name: rmqproxy
    networks:
      bmp-mid-network:
        ipv4_address: 10.0.11.42
    depends_on:
      - broker
      - namesrv
    ports:
      - 8080:8080
      - 8081:8081
    restart: on-failure
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqproxy

networks:
  bmp-mid-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.11.0/24
          gateway: 10.0.11.1