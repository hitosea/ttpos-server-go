services:

  php:
    container_name: "saas-php-${APP_ID}"
    image: hitosea2020/php-fpm:1.0.6
    volumes:
      - ./docker:/var/docker
      - ./docker/php/conf.d/docker-vars.ini:/usr/local/etc/php/conf.d/docker-vars.ini
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
      - ./docker/php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./docker/php/supervisor/supervisor.conf:/etc/supervisor/conf.d/php.conf
      - ./admin/:/var/www
    env_file:
      - ./.env
    restart: always
    depends_on:
      - db
      - redis
      
  nginx:
    container_name: "saas-nginx-${APP_ID}"
    image: "nginx:alpine"
    ports:
      - "${NGINX_PORT:-}:80"
      - "${NGINX_SSL_PORT:-}:443"
    volumes:
      - ./docker/sysctl/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx:/etc/nginx/conf.d
      - ./admin/public:/var/www/public
    links:
      - php
    restart: unless-stopped

  db:
    container_name: "saas-db-${APP_ID}"
    image: "mariadb:10.11.6"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - ./docker/mysql/repassword.sh:/etc/mysql/repassword.sh
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_PREFIX: "${DB_PREFIX}"
      MARIADB_HOST: "${DB_HOST}"
    restart: always

  redis:
    container_name: "saas-redis-${APP_ID}"
    image: redis:6
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    
  golang:
    container_name: "saas-golang-${APP_ID}"
    image: golang:1.23
    volumes:
      - ./docker/golang/web:/go
      - ./main:/var/www
      - .env:/var/.env
    working_dir: /var/www
    tty: true
    command: make run
    restart: always

  websocket:
    container_name: "saas-websocket-${APP_ID}"
    image: golang:1.23
    volumes:
      - ./docker/golang/websocket:/go
      - ./services/websocket:/var/www/websocket
      - .env:/var/.env
    working_dir: /var/www/websocket
    tty: true
    command: make run
    restart: always

  