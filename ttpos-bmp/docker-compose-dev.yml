services:
  #中台服务模块
  bmp-takeout:
    container_name: "ttpos-bmp-takeout-${APP_ID}"
    build:
      args:
        MODULE: takeout
        HTTP_PORT: 14031
        RPC_PORT: 14032
    image: ttpos-bmp-takeout
    environment:
      GRPC_ENDPOINTS: "${GRPC_ENDPOINTS}:14032"  #生产环境调成服务IP
    volumes:
      - ./app/ttpos-takeout/manifest/config:/app/config  #生产环境根据需要调整
    restart: always
    ports:
      - "14031:14031"
      - "14032:14032"
    networks:
      ttpos-bmp-mid_bmp-mid-network:
      bmp-network:
        ipv4_address: 10.0.10.40

