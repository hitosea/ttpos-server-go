// 公司服务 Protobuf 定义文件
// 用于定义公司相关的 gRPC 服务接口和消息结构
syntax = "proto3";
import "erp.proto";
package company;

// Go 包路径配置，指定生成的 Go 代码存放位置
option go_package = "ttpos-bmp/app/ttpos-erp/api/company";


// 获取公司列表请求消息
// 用于向服务端发送获取公司列表的请求
message GetCompanyListReq {
  string company_name = 1; // 公司名称模糊查询，可选，如: %公司名称%
}

// 获取公司列表响应消息
// 服务端返回的公司列表和分页信息
message GetCompanyListResp {
  repeated CompanyInfo company_list = 1; // 公司信息列表
}

// 公司信息消息
// 用于在列表中展示的公司基本信息
message CompanyInfo {
  string company_abbr = 1;                    // 公司缩写编码
  string company_name = 2;                  // 公司名称

}

// 创建分店请求消息
// 用于向服务端发送创建分店的请求
message CreateBranchReq {
  string shop_name = 1;     // 店铺名称，必填
  string company_abbr = 2;  // 公司缩写编码，必填
  string shop_uuid = 3;     // 店铺UUID，必填
}

// 创建分店响应消息
// 服务端返回的创建分店结果
message CreateBranchResp {
  string erp_user_email = 1; // ERP用户邮箱，创建成功时返回
}


// 公司服务接口定义
// 提供公司信息查询相关的 gRPC 服务方法
service CompanyService {
  // 获取公司列表
  // 参数：查询条件
  // 返回：公司列表和分页信息
  rpc GetCompanyList(company.GetCompanyListReq) returns (erp.ResponseInfo);

  // 创建分店
  // 参数：店铺名称和公司缩写编码
  // 返回：ERP用户名和创建结果
  rpc CreateBranch(company.CreateBranchReq) returns (erp.ResponseInfo);
}
