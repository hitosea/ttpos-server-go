// ItemGroup 服务 Protobuf 定义文件
// 用于定义物品分组相关的 gRPC 服务接口和消息结构
syntax = "proto3";

import "erp.proto";

package item;

// Go 包路径配置
option go_package = "ttpos-bmp/app/ttpos-erp/api/item";

// ItemGroup 服务接口定义
// 提供物品分组管理相关的 gRPC 服务方法
service ItemGroupService {
  // 获取物品分组列表
  // 参数：分页和过滤条件
  // 返回：物品分组列表
  rpc GetItemGroupList(GetItemGroupListReq) returns (erp.ResponseInfo);
  
  // 根据分组代码获取单个物品分组信息
  // 参数：分组代码
  // 返回：物品分组详细信息
  rpc GetItemGroup(GetItemGroupReq) returns (erp.ResponseInfo);
  
  // 保存物品分组信息
  // 参数：物品分组信息
  // 返回：保存结果
  rpc SaveItemGroup(SaveItemGroupReq) returns (erp.ResponseInfo);
  
  // 删除物品分组
  // 参数：分组代码
  // 返回：删除结果
  rpc DeleteItemGroup(DeleteItemGroupReq) returns (erp.ResponseInfo);

  //保存属性分组
  rpc SaveAttributeGroup(SaveAttributeGroupReq) returns (erp.ResponseInfo);

  //删除属性分组
  rpc DeleteAttributeGroup(DeleteAttributeGroupReq) returns (erp.ResponseInfo);

  //保存加料分组, 没有删除接口，预留后续用，目前默认每个门店只有一个自己门店的加料分组
  rpc SaveAddonGroup(SaveAddonGroupReq) returns (erp.ResponseInfo);

}

// 获取物品分组列表请求消息
message GetItemGroupListReq {
  string branch = 1; // 分支名称，可选
  string company_abbr = 2; // 公司缩写，可选
  string parent_item_group = 3; // 分组名称查询，可选
}

// 获取物品分组列表响应消息
message GetItemGroupListResp {
  repeated ItemGroupInfo item_group_list = 1; // 物品分组列表
}

// 获取单个物品分组请求消息
message GetItemGroupReq {
  string group_code = 1; // 分组代码，必填
}

message GetItemGroupResp {
  ItemGroupInfo item_group_info = 1; // 物品分组信息，必填
}

// 保存物品分组请求消息
message SaveItemGroupReq {
  ItemGroupInfo item_group_info = 1; // 物品分组信息，必填
}

message SaveItemGroupResp {
  ItemGroupInfo item_group_info = 1; // 物品分组信息，必填
}

// 删除物品分组请求消息
message DeleteItemGroupReq {
  string item_group_name = 1; // 分组名，必填
}

// 物品分组信息消息
message ItemGroupInfo {
  string item_group_name = 1; // 分组名称，必填
  string parent_item_group = 2; // 父级分组，可选
  string company_abbr = 3; // 公司缩写，可选
  bool is_group = 4; // 是否为分组，可选
  string branch = 5; // 分支名称，可选
  string alias_name = 6; // 别名，可选
}


message AttributeGroupInfo {
  string alias_name = 1; // 别名，必填
  string company_abbr = 2; // 公司缩写，可选
  string branch = 3; // 分支名称，可选
  string group_name = 4; // 分组名称，修改时必填
  repeated AttributeItemInfo attribute_item_list = 5; // 属性物品列表，必填
}

message AttributeItemInfo {
  string alias_name = 1; // 物品别名，必填
  string item_code = 2; // 物品编码，创建时必填
}


message SaveAttributeGroupReq {
    AttributeGroupInfo attribute_group_info = 1; // 属性分组信息，必填
}

message DeleteAttributeGroupReq {
  string group_name = 1; // 分组名称，必填
}

message SaveAttributeGroupResp {
  AttributeGroupInfo attribute_group_info = 1; // 属性分组信息，必填
}

message AddonGroupInfo {
//  string alias_name = 1; // 别名，必填
  string company_abbr = 1; // 公司缩写，可选
  string branch = 2; // 分支名称，可选
  string group_name = 3; // 分组名称，修改时必填
  repeated AddonItemInfo addon_item_list = 4; // 加料物品列表，必填
}

message AddonItemInfo {
  string item_code = 1; // 物品编码，必填
  string alias_name = 2; // 物品别名，必填
}


message SaveAddonGroupReq {
  AddonGroupInfo addon_group_info = 1; // 加料分组信息，必填
}


message SaveAddonGroupResp {
  AddonGroupInfo addon_group_info = 1; // 加料分组信息，必填
}