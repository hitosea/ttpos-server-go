syntax = "proto3";
import "erp.proto" ;
package item;

// Go 包路径配置，指定生成的 Go 代码存放位置
option go_package = "ttpos-bmp/app/ttpos-erp/api/item";

message GetItemListReq {
  string item_group = 1; // 物品分组，可选  Products 商品/Raw Material 原材料
  string item_name = 2; // 商品名称模糊查询，可选，如: %商品名称%
  string branch = 3; // 分支名称，可选
  string company_abbr = 4; // 公司简称，可选
  string item_code = 5; // 物品编码，可选
}

message GetItemListResp {
  repeated ItemInfo item_list = 1; // 物品列表
}

message ItemInfo {
  string item_name = 1; // 物品名称，必填
  string item_group = 2; // 物品分组，必填 Products 商品/Raw Material 原材料
  string stock_uom = 3; // 库存单位，必填 ttpos 传英文过来
  string item_code = 4; // 物品编码，可选
  string branch = 5; // 分支名称，可选
  string company_abbr = 6; // 公司简称，可选
  string company = 7; // 公司名称，可选
  string item_specification = 8; // 物品规格，可选 ttpos 传英文过来
  bool is_stock_item = 9; // 是否库存物品，可选
}


message GetItemGroupListReq {
  string branch = 1; // 分支名称，可选
  string item_group_name = 2; // 物品分组，可选
}

message GetItemGroupListResp {
  string branch = 1; // 分支名称，可选
  string item_group_name = 2; // 物品分组，可选
}

message GetUomListReq {
  string branch = 1; // 分支名称，可选
  string company_abbr = 2; // 公司简称，可选
  string uom_name = 3; // 单位名称，可选
  string alias_name = 4; // 单位别名，可选
}


message GetUomListResp {
  repeated UomInfo uom_list = 1; //单位列表
}

message UomInfo {
  string uom_name = 1; // 单位名称，必填
  string branch = 2; // 分支名称，可选
  string company_abbr = 3; // 公司简称，可选
  string company = 4; // 公司名称，可选
  string alias_name = 5; // 单位别名，可选
  bool must_be_whole_number = 6; // 是否必须为整数
}


message GetAttributeListReq {
  string branch = 1; // 分支名称，可选
  string company_abbr = 2; // 公司简称，可选
  string attribute_name = 3; // 属性名称，可选
  string alias_name = 4; // 属性别名，可选
}

message AttributeInfo {
  string attribute_name = 1; // 属性名称，必填
  string branch = 2; // 分支名称，可选
  string company = 3; // 公司名称，可选
  string company_abbr = 4; // 公司简称，可选
  string alias_name = 5; // 属性别名，可选
  repeated AttributeValueInfo attribute_value_list = 6; // 属性值列表
}

message AttributeValueInfo {
  string attribute_value = 1; // 属性值，必填
  string abbr = 2; // 属性缩写，必填
}

message GetAttributeListResp {
  repeated AttributeInfo attribute_list = 1; // 属性列表
}

service ItemService {
  // 获取商品列表
  // 参数：查询条件
  // 返回：商品列表和分页信息
  rpc GetItemList(item.GetItemListReq) returns (erp.ResponseInfo);

  // 获取单位列表
  // 参数：查询条件
  // 返回：单位列表和分页信息
  rpc GetUomList(item.GetUomListReq) returns (erp.ResponseInfo);

  // 添加单位
  // 参数：单位信息
  // 返回：添加结果
  rpc SaveUom(item.UomInfo) returns (erp.ResponseInfo);

  // 获取属性列表
  // 参数：查询条件
  // 返回：属性列表和分页信息
  rpc GetAttributeList(item.GetAttributeListReq) returns (erp.ResponseInfo);

  // 添加属性
  // 参数：属性信息
  // 返回：添加结果
  rpc SaveAttribute(item.AttributeInfo) returns (erp.ResponseInfo);

  // 添加商品
  // 参数：商品信息
  // 返回：添加结果 TTPOS 端调用成功后后更新 item_code 到商品/物品信息中
  rpc SaveItem(item.ItemInfo) returns (erp.ResponseInfo);
}