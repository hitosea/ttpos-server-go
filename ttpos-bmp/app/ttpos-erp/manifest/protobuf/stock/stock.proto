syntax = "proto3";
import "erp.proto" ;
package stock;

// Go 包路径配置，指定生成的 Go 代码存放位置
option go_package = "ttpos-bmp/app/ttpos-erp/api/stock";


message  MaterialRequest {
  string material_request_name = 1;      // 物品申请单名称
  int64 transaction_date = 2;      // 交易日期
  int64 required_by = 3;      // 需求时间
  string material_request_type = 4;      // 申请类型
  string company = 5;      // 公司
  repeated MaterialRequestItem items = 6;      // 物品列表，
  string status = 7 ;  //状态 Draft/Pending/Cancelled/Received
}


message MaterialRequestItem {
  string item_code = 1;      // 物品编码，
  int64 schedule_date = 2;      // 到货时间，
  double qty = 3;      // 物品数量，
  string warehouse = 4;      // 仓库名称，可选
  string uom = 5;      // 物品单位，
}

message SaveMaterialRequestReq {
  int64 transaction_date = 1;      // 单据日期,必填
  string company_abbr = 2;      // 公司缩写,必填
  string branch = 3;      // 分支名称 必填
  int64 required_by = 4;      // 需求时间,必填
  string source_warehouse =5 ; //来源仓库，必填
  string target_warehouse = 6 ; //目标仓库，必填
  string purpose = 7;      // 申请目的,可选 默认 Purchase
  string supplier = 8;      // 供应商名称, purpose 为 Purchases时 必填
  repeated MaterialRequestItem items = 9;      // 物品列表，
  string ref_no = 10;      // 来源单据号，可选，用于跟踪 ttpos 原始订单号
}

message SaveMaterialRequestResp {
  string material_request_name = 1;      // 物品申请单名称
  string purchase_order = 2;      // 采购订单号
  string sales_order = 3;      // 内部销售订单号
}

message GetMaterialRequestListReq {
  string company_abbr = 1;      // 公司缩写,必填
  string branch = 2;      // 分支名称,可选
}

message GetMaterialRequestListResp {
  repeated MaterialRequest material_request_list = 1; // 物品申请单列表
}

// 库存分类账信息
message StockLedger {
  string item_code = 1;                 // 物品编码
  string date = 2;                      // 日期
  string warehouse = 3;                 // 仓库
  string posting_date = 4;              // 过账日期
  string posting_time = 5;              // 过账时间
  double actual_qty = 6;                // 实际数量
  double incoming_rate = 7;             // 入库价格
  double valuation_rate = 8;            // 估值价格
  string company = 9;                   // 公司
  string voucher_type = 10;             // 凭证类型
  double qty_after_transaction = 11;    // 交易后数量
  double stock_value_difference = 12;   // 库存价值差额
  string serial_and_batch_bundle = 13;  // 序列号和批次包
  string voucher_no = 14;               // 凭证编号
  double stock_value = 15;              // 库存价值
  string batch_no = 16;                 // 批次号
  string serial_no = 17;                // 序列号
  string project = 18;                  // 项目
  string name = 19;                     // 名称
  string item_name = 20;                // 物品名称
  string description = 21;              // 描述
  string item_group = 22;               // 物品分组
  string brand = 23;                    // 品牌
  string stock_uom = 24;                // 库存单位
  double in_qty = 25;                   // 入库数量
  double out_qty = 26;                  // 出库数量
  double in_out_rate = 27;              // 进出库价格
}

// 获取库存分类账请求
message GetStockLedgerReq {
  string company_abbr = 1;              // 公司缩写，必填
  string from_date = 2;                 // 开始日期，必填
  string to_date = 3;                   // 结束日期，必填
  string branch = 4;                    // 分支机构，可选。 未传仓库时，选择默认仓库的时候用
  string warehouse = 5;                 // 仓库名称，可选
  string item_code = 6;                 // 物品编码，可选
  string voucher_no = 7;              // 凭证编号，可选
  int32 limit = 8;                      // 查询限制数量，可选，默认100
}

// 获取库存分类账响应
message GetStockLedgerResp {
  repeated StockLedger stock_ledger_list = 1; // 库存分类账列表，最大返回1000条，超过1000条时，调整查询条件
}

// 库存盘点明细
message StockReconciliationItem {
  string item_code = 1;            // 物品编码，必填
  string item_name = 2;            // 物品名称, 可选
  double qty = 3;                  // 盘点数量，必填
  string warehouse = 4;            // 仓库名称，可选
  double valuation_rate = 5;       // 估值价格，可选, 默认1
}

// 保存库存盘点请求
message SaveStockReconciliationReq {
  string company_abbr = 1;                            // 公司缩写，必填
  string branch = 2;                                  // 分支名称，可选
  string posting_date = 3;                            // 过账日期，必填，格式：YYYY-MM-DD
  string posting_time = 4;                            // 过账时间，可选，格式：HH:MM:SS，如 18:20:11
  string purpose = 5;                                 // 用途，可选，默认 Stock Reconciliation / Opening Stock
  string warehouse = 6;                               // 仓库名称，可选
  repeated StockReconciliationItem items = 7;         // 盘点明细，必填
  string inventory_type = 8;                          // 盘点类型，可选，可选值：Daily inventory/Weekly inventory/Monthly inventory/Designated item inventory/Inventory of all items
}

// 保存库存盘点响应
message SaveStockReconciliationResp {
  string stock_reconciliation_name = 1;               // 库存盘点单号
}

// 获取库存盘点列表请求
message GetStockReconciliationListReq {
  string company_abbr = 1;                            // 公司缩写，必填
  string branch = 2;                                  // 分支名称，可选
  string from_date = 3;                               // 开始日期，可选，格式：YYYY-MM-DD
  string to_date = 4;                                 // 结束日期，可选，格式：YYYY-MM-DD
  string warehouse = 5;                               // 仓库名称，可选
  string purpose = 6;                                 // 用途，可选
  int32 limit = 7;                                    // 查询限制数量，可选，默认100
}

// 库存盘点信息
message StockReconciliation {
  string name = 1;                                    // 单据编号
  string company = 2;                                 // 公司
  string purpose = 3;                                 // 用途
  string posting_date = 4;                            // 过账日期
  string posting_time = 5;                            // 过账时间
  string set_warehouse = 6;                           // 设置仓库
  repeated StockReconciliationItem items = 7;        // 盘点明细
}

// 获取库存盘点列表响应
message GetStockReconciliationListResp {
  repeated StockReconciliation stock_reconciliation_list = 1; // 库存盘点列表
}

// 提交库存盘点请求
message SubmitStockReconciliationReq {
  string stock_reconciliation_name = 1;               // 库存盘点单号，必填
}

// 提交库存盘点响应
message SubmitStockReconciliationResp {
  string message = 1;                                 // 操作结果消息
}

// 取消库存盘点请求
message CancelStockReconciliationReq {
  string stock_reconciliation_name = 1;               // 库存盘点单号，必填
}

// 取消库存盘点响应
message CancelStockReconciliationResp {
  string message = 1;                                 // 操作结果消息
}

// 查询 Bin 记录请求
message GetBinReq {
  string item_code = 1;                               // 物品代码，可选
  string warehouse = 2;                               // 仓库名称，必填
}

// 查询 Bin 记录响应
message GetBinResp {
  repeated ItemStockBin items = 1;                    // Bin 记录列表
}

// 货位库存信息（合并 BinData 和 ItemStockByBin）
message ItemStockBin {
  string item_code = 1;                               // 商品代码
  string warehouse = 2;                               // 仓库名称
  double actual_qty = 3;                              // 实际库存数量
  double projected_qty = 4;                           // 预计库存数量
  double reserved_qty = 5;                    // 预留数量
  string stock_uom = 6;                                // 库存单位
  double valuation_rate = 7;                           // 估价率
  double stock_value = 8;                             // 库存价值
}

// 库存变动明细项
message StockEntryItem {
  string item_code = 1;                               // 物品编码，必填
  double qty = 2;                                     // 数量，必填
  string item_name = 3;                               // 物品名称，可选
  string warehouse = 4;                               // 仓库，可选（覆盖请求中的 source_warehouse）
}

// 提交库存变动请求
message SubmitStockEntryReq {
  string company_abbr = 1;                            // 公司缩写，必填
  string branch = 2;                                  // 分支名称，可选
  string stock_entry_type = 3;                        // 库存变动类型，可选，默认 Material Issue
  string source_warehouse = 4;                        // 源仓库，可选
  repeated StockEntryItem items = 5;                  // 变动明细，必填
  string posting_date = 6;                            // 过账日期，可选，格式：YYYY-MM-DD
  string posting_time = 7;                            // 过账时间，可选，格式：HH:MM:SS
  string remarks = 8;                                 // 备注，可选
}

// 提交库存变动响应
message SubmitStockEntryResp {
  string stock_entry_name = 1;                        // 库存变动单号
  string message = 2;                                 // 操作结果消息
}

service StockService {
  // 保存物品申请单
  // 参数：物品申请单信息
  // 返回：操作结果
  rpc SaveMaterialRequest(SaveMaterialRequestReq) returns (erp.ResponseInfo);

  // 获取物品申请单列表
  // 参数：查询条件
  // 返回：物品申请单列表和分页信息
  rpc GetMaterialRequestList(GetMaterialRequestListReq) returns (erp.ResponseInfo);

  // 获取库存分类账
  // 参数：查询条件，包含公司、仓库、物品编码等过滤条件
  // 返回：库存分类账列表
  rpc GetStockLedger(GetStockLedgerReq) returns (erp.ResponseInfo);

  // 保存库存盘点
  // 参数：库存盘点信息
  // 返回：操作结果
  rpc SaveStockReconciliation(SaveStockReconciliationReq) returns (erp.ResponseInfo);

  // 获取库存盘点列表
  // 参数：查询条件
  // 返回：库存盘点列表
  rpc GetStockReconciliationList(GetStockReconciliationListReq) returns (erp.ResponseInfo);

  // 提交库存盘点
  // 参数：库存盘点单号
  // 返回：操作结果
  rpc SubmitStockReconciliation(SubmitStockReconciliationReq) returns (erp.ResponseInfo);

  // 取消库存盘点
  // 参数：库存盘点单号
  // 返回：操作结果
  rpc CancelStockReconciliation(CancelStockReconciliationReq) returns (erp.ResponseInfo);

  // 查询物品在指定仓库的 Bin 记录
  // 参数：仓库名称（必填）、物品代码（可选，为空时返回该仓库所有物品的 Bin 记录）
  // 返回：货位库存信息列表，包括实际库存数量、估值率、库存价值
  rpc GetBin(GetBinReq) returns (erp.ResponseInfo);

  // 提交库存变动（物料出库）
  // 参数：库存变动信息，包含公司、仓库、物品列表
  // 返回：库存变动单号
  rpc SubmitStockEntry(SubmitStockEntryReq) returns (erp.ResponseInfo);
}
