syntax = "proto3";
import "erp.proto";

package selling;

option go_package = "ttpos-bmp/app/ttpos-erp/api/selling";

// PosProfileReq 查询Pos Profile请求消息
message PosProfileReq {
  // Pos Profile名称
  string name = 1;
  string company = 2; // 公司名称
  string company_abbr = 3; // 公司缩写, 必填
}

// PosProfile 查询Pos Profile响应消息
message PosProfile {
  // Pos Profile名称
  string name = 1;
  string company = 2; // 公司名称
  string branch = 3; // 分店名称
  string warehouse = 4; // 仓库名称
  string cashier = 5; // 收银员
}

message PosProfileListResp {
  // Pos Profile名称
  repeated PosProfile profile_list = 1;
}

message CreatePaymentAccountReq {
  string company_abbr = 1; // 公司缩写, 必填
  string payment_type = 2; // 支付类型，必填 Cash/Balance/Free Meal/Wechat Pay/Alipay/QR PromptPay
  string branch = 3; // 分店名称,可选
  string payment_source = 4; // 支付来源,可选 2= lianlianpay
}

message OpenPosEntryReq {
  string pos_profile_name = 1; // Pos Profile名称,必填
  string cashier_email = 2; // 收银员邮箱,必填
  string company_abbr = 3; // 公司缩写,必填
  int64 period_start_date = 5; // 周期开始时间,必填
  repeated OpenPosEntryDetail open_pos_entry_detail = 6; // 开帐详情,必填
  string branch = 7; // 分店名称,可选
}

message OpenPosEntryInfo {
  string open_pos_entry_name = 1; // 开帐的Pos Profile名称
  string pos_profile_name = 2; // Pos Profile名称
  string cashier_email = 3; // 收银员邮箱,必填
  string company_abbr = 4; // 公司缩写,必填
  string branch = 5; // 分店名称,可选
  repeated OpenPosEntryDetail open_pos_entry_detail = 6; // 开帐详情
}

message OpenPosEntryDetail {
  optional string mode_of_payment = 1; // 支付方式，与 payment_id 二选一（必填其中之一）
  double opening_amount = 2; // 开帐金额,必填
  optional string payment_id = 3; // 支付方式唯一标识（PaymentID），与 mode_of_payment 二选一
  // 注意：当 payment_id 不为空时，系统自动调用 GetModeOfPayment 查询 mode_of_payment 值
}

message OpenPosEntryResp {
  OpenPosEntryInfo open_pos_entry_info = 1;
}

message ClosePosEntryReq {
  string pos_open_entry_name = 1; // 开帐名称,必填
  int64 period_end_date = 2; // 结账时间,必填
  repeated ClosePosEntryDetail close_pos_entry_detail = 3; // 关帐详情,必填
  int64 invoice_count = 4; // 发票数量,包含退款单数，不包含取消的单数
}

message ClosePosEntryDetail {
  optional string mode_of_payment = 1; // 支付方式，与 payment_id 二选一（必填其中之一）
  double opening_amount = 2; // 开帐金额,必填
  double closing_amount = 3; // 关帐金额,必填
  optional string payment_id = 4; // 支付方式唯一标识（PaymentID），与 mode_of_payment 二选一
  // 注意：当 payment_id 不为空时，系统自动调用 GetModeOfPayment 查询 mode_of_payment 值
}

message ClosePosEntryInfo {
  string close_pos_entry_name = 1; // 关帐的Pos Profile名称
  string pos_profile_name = 2; // Pos Profile名称
  int64 period_end_date = 3; // 周期结束时间,必填
  repeated ClosePosEntryDetail close_pos_entry_detail = 4; // 关帐详情
}

message ClosePosEntryResp {
  ClosePosEntryInfo close_pos_entry_info = 1;
  string async_record_id = 2; // 异步记录ID
}

// SavePosInvoiceReq 保存POS发票请求消息
message SavePosInvoiceReq {
  string order_no = 1; // 订单号,必填 传ttpos的订单号
  string open_pos_entry_name = 2;                    // POS开帐名称,必填
  string company_abbr = 3;                        // 公司缩写,必填
  int64 posting_datetime = 4;                        // 过账日期时间 格式为时间戳，必填， 传交易时间过来
  int32 update_stock = 5;                         // 是否更新库存 必填，默认选1 0=不更新 1=更新
  string currency = 6;                            // 货币 标准缩写例如 CNY/THB/USD 必填
  string price_list_currency = 7;                 // 价格表货币 标准缩写例如 CNY/THB/USD 必填
  string branch = 8;                              // 分店 可选
  string customer_uuid = 9;                       // 客户,可选
  repeated PosInvoiceItem items = 10;             // 商品项目列表 必填
  repeated PosInvoiceItem material_items = 11;             // 原材料项目列表 必填
  repeated PosInvoiceTax taxes = 12;              // 税费列表 必填
  repeated PosInvoicePayment payments = 13;       // 付款列表 必填
  string amended_products_invoice_name = 14; // 反结账后，重新结账时填写原商品发票名称
  string amended_material_invoice_name = 15; // 反结账后，重新结账时填写原材料发票名称
  string remark = 16; // 备注,可选
  optional string takeout_order_no = 17;    // 外卖订单号，可选
  optional string takeout_provider = 18;    // 外卖平台提供商，可选
}

// SavePosInvoiceResp 保存POS发票响应消息
message SavePosInvoiceResp {
  string products_invoice_name = 1; // 商品发票名称
  string material_invoice_name = 2; // 原材料发票名称
  string async_record_id = 3; // 异步记录ID
}

// PosInvoiceItem POS发票商品项目
message PosInvoiceItem {
  string item_code = 1;  // 商品编码，必填
  double qty = 2;         // 数量，必填
  double rate = 3;       // 单价，必填
  double amount = 4;     // 金额，必填
  string uom = 5; // 单位, 可选
  string description = 6;     // 描述, 可选。 如果是套餐内的商品，填写内容 “Sales in package:{套餐名称}”
  bool is_free_item = 7; // 是否免单商品, 可选, 默认false
}

// PosInvoiceTax POS发票税费
message PosInvoiceTax {
  double rate = 1;            // 税率，必填 费用填0
  double tax_amount = 2;      // 税费金额，必填
  string description = 3;     // 描述, 必填.例如 Tax/Service Fee/Payment Processing Fee/Delivery Fee
}

// PosInvoicePayment POS发票付款
message PosInvoicePayment {
  string mode_of_payment = 1; // 支付方式，与 payment_id 二选一（必填其中之一）
  double amount = 2;          // 金额，必填
  optional string payment_id = 3; // 支付方式唯一标识（PaymentID），与 mode_of_payment 二选一
  // 注意：当 payment_id 不为空时，系统自动调用 GetModeOfPayment 查询 mode_of_payment 值
}

// ReturnPosInvoiceReq 退款POS发票请求消息
message ReturnPosInvoiceReq {
  string order_no = 1; // 退款订单号,必填 传ttpos的退款订单号
  string open_pos_entry_name = 2;                    // POS开帐名称,必填
  int64 posting_datetime = 3;                        // 过账日期时间 格式为时间戳，必填， 传交易时间过来
  string company_abbr = 4;                        // 公司缩写,必填
  string invoice_name = 5;                         // 销售发票
  repeated PosInvoiceItem items = 6;             // 商品项目列表 必填
  repeated PosInvoiceTax taxes = 7;              // 税费列表 必填
  repeated PosInvoicePayment payments = 8;       // 付款列表 必填
  int64 invoice_type = 9; // 发票类型 1=商品发票 2=原材料发票 异步模式下必填
  string remark = 10; // 附注/备注,可选
}

// ReturnPosInvoiceResp 退款POS发票响应消息
message ReturnPosInvoiceResp {
  string invoice_name = 1; // 商品发票名称
  string async_record_id = 2; // 异步记录ID
}

// CancelPosInvoiceReq 取消POS发票请求消息，反结账时调用
message CancelPosInvoiceReq {
  string products_invoice_name = 1;                         // 商品销售发票，必填
  string material_invoice_name = 2;                         // 材料销售发票，必填
  string order_no = 3; // 订单号，传ttpos的订单号,异步模式下必填
  string open_pos_entry_name = 4; // POS开帐名称,异步模式下必填
  string remark = 5; // 附注/备注,可选
}

message CancelPosInvoiceResp {
  string products_invoice_name = 1; // 商品发票名称
  string material_invoice_name = 2; // 材料发票名称
  string async_record_id = 3; // 异步记录ID
}


message ModeOfPayment {
  string name = 1; // 支付方式名称
  bool enabled = 2; // 是否启用
  string payment_id = 3; // 支付方式唯一标识（PaymentID）
}

// SaveModeOfPaymentReq 保存/同步支付方式请求
message SaveModeOfPaymentReq {
  string company_abbr = 1; // 公司简称，必填
  string branch = 2;       // 分支，必填
  string channel = 3;      // 渠道，如 LianLianPay，创建时必填
  string pay_type = 4;     // 支付类型（TTPOS 定义），创建时必填
  optional bool enabled = 5; // 是否启用，可选：仅在明确传入时更新 ERP 启用状态
  optional string name = 6;  // 支付方式名称，可选：传入时执行更新操作，未传入时执行创建操作
  string payment_id = 7;     // 支付方式唯一标识（PaymentID），可选：创建时若未提供则自动生成 PID+16位数字
  optional string added_by = 8; // 创建来源标识，"sys" 表示系统创建
}

// SaveModeOfPaymentResp 保存/同步支付方式响应
message SaveModeOfPaymentResp {
  string name = 1;       // 规范化名称 [channel-]{pay_type}-{NNNN} - {company_abbr}
  string payment_id = 2; // 支付方式唯一标识（PaymentID）
}

message GetModeOfPaymentListReq {
  string company_abbr = 1; // 公司缩写,可选
  string branch = 2; // 分支名称,可选
}

message GetModeOfPaymentListResp {
  repeated ModeOfPayment mode_of_payment_list = 1; // 支付方式列表
}

// GetModeOfPaymentReq 查询单个支付方式请求
message GetModeOfPaymentReq {
  optional string name = 1;       // 支付方式名称（精确匹配），与 payment_id 二选一
  optional string payment_id = 2; // 支付方式唯一标识（PaymentID），与 name 二选一
}

// GetModeOfPaymentResp 查询单个支付方式响应
message GetModeOfPaymentResp {
  ModeOfPayment mode_of_payment = 1; // 支付方式信息
}

// ========== Sales Invoice (SI) 相关 ==========

// SaveSalesInvoiceReq 保存 Sales Invoice 请求 (替代 POS Invoice)
message SaveSalesInvoiceReq {
  string order_no = 1;                              // TTPOS 订单号
  string sale_order_uuid = 2;                       // TTPOS 订单 UUID（幂等键）
  string sale_bill_uuid = 3;                        // TTPOS 账单 UUID
  string pos_profile = 4;                           // POS Profile 名称
  string company_abbr = 5;                           // 公司缩写（如 CFG），BMP 通过缩写查询公司全名
  string customer = 6;                              // 客户（默认客户或会员）
  string currency = 7;                              // 货币 THB/CNY
  string price_list_currency = 8;                   // 价格表货币
  int64 posting_datetime = 9;                       // 支付完成时间戳
  string branch = 10;                               // 分店
  int32 update_stock = 11;                          // 0=不扣库存
  repeated PosInvoiceItem items = 12;               // 商品明细（复用 PosInvoiceItem）
  repeated PosInvoiceItem material_items = 13;      // 物品明细（价格为0）
  repeated PosInvoiceTax taxes = 14;                // 税费
  repeated PosInvoicePayment payments = 15;         // 支付方式列表
  string remark = 16;                               // 备注
  optional string order_source_uuid = 17;           // 订单来源UUID
  optional string order_source_name = 18;           // 订单来源名称
  optional string takeout_order_no = 19;            // 外卖订单号
  optional string takeout_provider = 20;            // 外卖平台
  double discount_amount = 21;                      // 额外折扣金额
  string amended_from = 22;                         // 反结账后的原单据号
  string company_uuid = 23;                         // TTPOS 商户UUID（用于异步回写 shop 数据库）
  string order_type = 24;                            // 订单类型: sale_order/recharge/takeout
}

// SaveSalesInvoiceResp 保存 Sales Invoice 响应
message SaveSalesInvoiceResp {
  string sales_invoice_name = 1;                    // SI 单据名称
  repeated string payment_entry_names = 2;          // PE 单据名称列表
  string async_record_id = 3;                       // 异步记录ID
}

// CancelSalesInvoiceReq 取消 Sales Invoice 请求
message CancelSalesInvoiceReq {
  string order_no = 1;                              // TTPOS 订单号
  string sale_order_uuid = 2;                       // 订单 UUID（幂等键）
  string sales_invoice_name = 3;                    // SI 单据名称
  repeated string payment_entry_names = 4;          // PE 单据名称列表
  bool stock_deducted = 5;                          // 是否已通过 Stock Entry 扣库存
  string remark = 6;
}

// CancelSalesInvoiceResp 取消 Sales Invoice 响应
message CancelSalesInvoiceResp {
  string async_record_id = 1;
}

// ReturnSalesInvoiceReq 退款 (Credit Note) 请求
message ReturnSalesInvoiceReq {
  string order_no = 1;
  string sale_order_uuid = 2;
  string sales_invoice_name = 3;                    // 原 SI 名称
  int64 posting_datetime = 4;
  string company_abbr = 5;                            // 公司缩写（如 CFG）
  string customer = 6;
  repeated PosInvoiceItem items = 7;                // 退款商品
  repeated PosInvoiceItem material_items = 8;       // 退款物品
  repeated PosInvoiceTax taxes = 9;
  repeated PosInvoicePayment payments = 10;         // 原支付方式的退款金额
  string refund_type = 11;                          // full_refund / partial_refund
  string remark = 12;
}

// ReturnSalesInvoiceResp 退款 (Credit Note) 响应
message ReturnSalesInvoiceResp {
  string credit_note_name = 1;
  repeated string payment_entry_names = 2;
  string async_record_id = 3;
}

// SellingService 服务定义
service SellingService {
  // 查询Pos Profile
  rpc GetPosProfileList (PosProfileReq) returns (erp.ResponseInfo);
  // 在erpnext 新增支付账号
  rpc CreatePaymentAccount (CreatePaymentAccountReq) returns (erp.ResponseInfo);
  //Pos 开帐
  rpc OpenPosEntry (OpenPosEntryReq) returns (erp.ResponseInfo);

  //Pos 关帐
  rpc ClosePosEntry (ClosePosEntryReq) returns (erp.ResponseInfo);

  //保存 Pos Invoice
  rpc SavePosInvoice (SavePosInvoiceReq) returns (erp.ResponseInfo);

  // 退款 Pos Invoice
  rpc ReturnPosInvoice (ReturnPosInvoiceReq) returns (erp.ResponseInfo);

  // 取消 Pos Invoice
  rpc CancelPosInvoice (CancelPosInvoiceReq) returns (erp.ResponseInfo);

  // 保存 Sales Invoice (替代 POS Invoice)
  rpc SaveSalesInvoice (SaveSalesInvoiceReq) returns (erp.ResponseInfo);

  // 取消 Sales Invoice
  rpc CancelSalesInvoice (CancelSalesInvoiceReq) returns (erp.ResponseInfo);

  // 退款 Sales Invoice (Credit Note)
  rpc ReturnSalesInvoice (ReturnSalesInvoiceReq) returns (erp.ResponseInfo);

  //获取支付方式列表
  rpc GetModeOfPaymentList (GetModeOfPaymentListReq) returns (erp.ResponseInfo);

  // 查询单个支付方式
  rpc GetModeOfPayment (GetModeOfPaymentReq) returns (erp.ResponseInfo);

  // 保存支付方式
  rpc SaveModeOfPayment (SaveModeOfPaymentReq) returns (erp.ResponseInfo);

  // 获取 SI 失败统计（死信队列）
  rpc GetFailedSIStats (GetFailedSIStatsReq) returns (erp.ResponseInfo);

  // 重试失败的 SI 记录
  rpc RetryFailedSI (RetryFailedSIReq) returns (erp.ResponseInfo);
}

// GetFailedSIStatsReq 查询失败 SI 统计请求
message GetFailedSIStatsReq {
  string site_code = 1; // 站点编码，可选（为空查所有站点）
}

// FailedSIStats 失败 SI 统计响应
message FailedSIStats {
  int32 save_failed_count = 1;   // SaveSI 失败数
  int32 cancel_failed_count = 2; // CancelSI 失败数
  int32 return_failed_count = 3; // ReturnSI 失败数
  int32 total_failed_count = 4;  // 总失败数
  int32 save_pending_count = 5;   // SaveSI 进行中数量
  int32 cancel_pending_count = 6; // CancelSI 进行中数量
  int32 return_pending_count = 7; // ReturnSI 进行中数量
  int32 total_pending_count = 8;  // 总进行中数量
}

// RetryFailedSIReq 重试/跳过失败 SI 请求
message RetryFailedSIReq {
  string site_code = 1;       // 站点编码，可选
  int64 record_id = 2;        // 指定记录ID，可选
  string sale_order_uuid = 3; // 指定订单UUID，可选
  string msg_type = 4;        // 消息类型，可选（save-sales-invoice/cancel-sales-invoice/return-sales-invoice，为空重试所有）
  string action = 5;          // 操作类型: 空/"retry"=重试, "skip"=标记跳过
}

// RetryFailedSIResult 重试结果
message RetryFailedSIResult {
  int32 retry_count = 1; // 成功重新入队的记录数
}
