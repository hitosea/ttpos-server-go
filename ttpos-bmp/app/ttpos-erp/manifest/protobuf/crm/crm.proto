// CRM 模块 Protobuf 定义文件
// 用于定义 CRM 相关的 gRPC 服务接口和消息结构
syntax = "proto3";

package crm;

// Go 包路径配置
option go_package = "ttpos-bmp/app/ttpos-erp/api/crm";


// CRM 服务接口定义
// 提供联系人和地址管理相关的 gRPC 服务方法
service CrmService {
  // 获取联系人列表
  // 参数：查询条件
  // 返回：联系人列表
  rpc GetContactList(GetContactListReq) returns (GetContactListResp);
  
  // 根据名称获取联系人详情
  // 参数：联系人名称
  // 返回：联系人详细信息
  rpc GetContact(GetContactReq) returns (GetContactResp);
  
  // 创建新联系人
  // 参数：联系人信息
  // 返回：创建结果
  rpc CreateContact(CreateContactReq) returns (CreateContactResp);
  
  // 更新联系人信息
  // 参数：联系人名称和更新数据
  // 返回：更新结果
  rpc UpdateContact(UpdateContactReq) returns (UpdateContactResp);
  
  // 删除联系人
  // 参数：联系人名称
  // 返回：删除结果
  rpc DeleteContact(DeleteContactReq) returns (DeleteContactResp);
  
  // 获取地址列表
  // 参数：查询条件
  // 返回：地址列表
  rpc GetAddressList(GetAddressListReq) returns (GetAddressListResp);
  
  // 根据名称获取地址详情
  // 参数：地址名称
  // 返回：地址详细信息
  rpc GetAddress(GetAddressReq) returns (GetAddressResp);
  
  // 创建新地址
  // 参数：地址信息
  // 返回：创建结果
  rpc CreateAddress(CreateAddressReq) returns (CreateAddressResp);
  
  // 更新地址信息
  // 参数：地址名称和更新数据
  // 返回：更新结果
  rpc UpdateAddress(UpdateAddressReq) returns (UpdateAddressResp);
  
  // 删除地址
  // 参数：地址名称
  // 返回：删除结果
  rpc DeleteAddress(DeleteAddressReq) returns (DeleteAddressResp);
}

// ==================== 联系人相关消息定义 ====================

// 获取联系人列表请求消息
message GetContactListReq {
  string company_abbr = 1;     // 公司简称
  string status = 2;           // 状态过滤
  string link_doctype = 3;     // 关联文档类型
  string link_name = 4;        // 关联文档名称
  int32 limit = 5;             // 限制数量
}

// 获取联系人列表响应消息
message GetContactListResp {
  repeated ContactInfo contact_list = 1; // 联系人列表
}

// 获取联系人详情请求消息
message GetContactReq {
  string name = 1; // 联系人名称
}

// 获取联系人详情响应消息
message GetContactResp {
  ContactInfo contact = 1; // 联系人详细信息
}

// 创建联系人请求消息
message CreateContactReq {
  string first_name = 1;           // 名
  string middle_name = 2;          // 中间名
  string last_name = 3;            // 姓
  string email_id = 4;             // 邮箱
  string phone = 5;                // 电话
  string mobile_no = 6;            // 手机号
  string status = 7;               // 状态
  string salutation = 8;           // 称谓
  string designation = 9;          // 职位
  string gender = 10;              // 性别
  string company_name = 11;        // 公司名称
  string department = 12;          // 部门
  repeated DynamicLinkInfo links = 13; // 关联链接
  repeated ContactPhoneInfo phone_nos = 14; // 电话号码列表
}

// 创建联系人响应消息
message CreateContactResp {
  string name = 1;        // 创建的联系人名称
  bool success = 2;       // 创建是否成功
  string message = 3;     // 结果消息
}

// 更新联系人请求消息
message UpdateContactReq {
  string name = 1;                 // 联系人名称
  string first_name = 2;           // 名
  string middle_name = 3;          // 中间名
  string last_name = 4;            // 姓
  string email_id = 5;             // 邮箱
  string phone = 6;                // 电话
  string mobile_no = 7;            // 手机号
  string status = 8;               // 状态
  string salutation = 9;           // 称谓
  string designation = 10;         // 职位
  string gender = 11;              // 性别
  string company_name = 12;        // 公司名称
  string department = 13;          // 部门
  repeated DynamicLinkInfo links = 14; // 关联链接
  repeated ContactPhoneInfo phone_nos = 15; // 电话号码列表
}

// 更新联系人响应消息
message UpdateContactResp {
  bool success = 1;       // 更新是否成功
  string message = 2;     // 结果消息
}

// 删除联系人请求消息
message DeleteContactReq {
  string name = 1; // 联系人名称
}

// 删除联系人响应消息
message DeleteContactResp {
  bool success = 1;       // 删除是否成功
  string message = 2;     // 结果消息
}

// ==================== 地址相关消息定义 ====================

// 获取地址列表请求消息
message GetAddressListReq {
  string company_abbr = 1;     // 公司简称
  string address_type = 2;     // 地址类型过滤
  string link_doctype = 3;     // 关联文档类型
  string link_name = 4;        // 关联文档名称
  int32 limit = 5;             // 限制数量
}

// 获取地址列表响应消息
message GetAddressListResp {
  repeated AddressInfo address_list = 1; // 地址列表
}

// 获取地址详情请求消息
message GetAddressReq {
  string name = 1; // 地址名称
}

// 获取地址详情响应消息
message GetAddressResp {
  AddressInfo address = 1; // 地址详细信息
}

// 创建地址请求消息
message CreateAddressReq {
  string address_title = 1;        // 地址标题
  string address_type = 2;         // 地址类型
  string address_line1 = 3;        // 地址行1
  string address_line2 = 4;        // 地址行2
  string city = 5;                 // 城市
  string county = 6;               // 县/区
  string state = 7;                // 州/省
  string country = 8;              // 国家
  string pincode = 9;              // 邮政编码
  string email_id = 10;            // 邮箱
  string phone = 11;               // 电话
  string fax = 12;                 // 传真
  repeated DynamicLinkInfo links = 15; // 关联链接
}

// 创建地址响应消息
message CreateAddressResp {
  string name = 1;        // 创建的地址名称
}

// 更新地址请求消息
message UpdateAddressReq {
  string name = 1;                 // 地址名称
  string address_title = 2;        // 地址标题
  string address_type = 3;         // 地址类型
  string address_line1 = 4;        // 地址行1
  string address_line2 = 5;        // 地址行2
  string city = 6;                 // 城市
  string county = 7;               // 县/区
  string state = 8;                // 州/省
  string country = 9;              // 国家
  string pincode = 10;             // 邮政编码
  string email_id = 11;            // 邮箱
  string phone = 12;               // 电话
  string fax = 13;                 // 传真
  bool is_primary_address = 14;    // 是否主要地址
  bool is_shipping_address = 15;   // 是否发货地址
  repeated DynamicLinkInfo links = 16; // 关联链接
}

// 更新地址响应消息
message UpdateAddressResp {
  bool success = 1;       // 更新是否成功
  string message = 2;     // 结果消息
}

// 删除地址请求消息
message DeleteAddressReq {
  string name = 1; // 地址名称
}

// 删除地址响应消息
message DeleteAddressResp {
  bool success = 1;       // 删除是否成功
  string message = 2;     // 结果消息
}

// ==================== 数据结构定义 ====================

// 联系人信息
message ContactInfo {
  string name = 1;                    // 联系人名称
  string first_name = 2;              // 名
  string middle_name = 3;             // 中间名
  string last_name = 4;               // 姓
  string full_name = 5;               // 全名
  string email_id = 6;                // 邮箱
  string phone = 7;                   // 电话
  string mobile_no = 8;               // 手机号
  string status = 9;                  // 状态
  string salutation = 10;             // 称谓
  string designation = 11;            // 职位
  string gender = 12;                 // 性别
  string company_name = 13;           // 公司名称
  string department = 14;             // 部门
  bool is_primary_contact = 15;       // 是否主要联系人
  bool is_billing_contact = 16;       // 是否账单联系人
  repeated DynamicLinkInfo links = 17; // 关联链接
  repeated ContactPhoneInfo phone_nos = 18; // 电话号码列表
}

// 地址信息
message AddressInfo {
  string name = 1;                    // 地址名称
  string address_title = 2;           // 地址标题
  string address_type = 3;            // 地址类型
  string address_line1 = 4;           // 地址行1
  string address_line2 = 5;           // 地址行2
  string city = 6;                    // 城市
  string county = 7;                  // 县/区
  string state = 8;                   // 州/省
  string country = 9;                 // 国家
  string pincode = 10;                // 邮政编码
  string email_id = 11;               // 邮箱
  string phone = 12;                  // 电话
  string fax = 13;                    // 传真
  bool is_primary_address = 14;       // 是否主要地址
  bool is_shipping_address = 15;      // 是否发货地址
  bool disabled = 16;                 // 是否禁用
  repeated DynamicLinkInfo links = 17; // 关联链接
}

// 动态链接信息
message DynamicLinkInfo {
  string link_doctype = 1;           // 链接文档类型
  string link_name = 2;              // 链接名称
  string link_title = 3;             // 链接标题
}

// 联系人电话信息
message ContactPhoneInfo {
  string phone = 1;                  // 电话号码
  bool is_primary_phone = 2;         // 是否主要电话
  bool is_primary_mobile_no = 3;     // 是否主要手机号
}
