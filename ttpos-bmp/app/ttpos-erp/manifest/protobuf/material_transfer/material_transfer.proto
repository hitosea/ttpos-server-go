syntax = "proto3";
import "erp.proto";

package material_transfer;
option go_package = "ttpos-bmp/app/ttpos-erp/api/material_transfer";


message MaterialTransferReq {
  string from_company_abbr = 1; // 调出方公司缩写, 必填
  string from_branch = 2; // 调出方分店名称,可选
  string to_company_abbr = 3; // 调入方公司缩写, 必填
  string to_branch = 4; // 调入方分店名称,可选
  string from_warehouse = 5; // 来源仓库,必填
  string to_warehouse = 6; // 目标仓库,必填
  string required_date = 7; // 到货日期, 格式: 2023-01-01,可选。 默认 2035-12-31
  string delivery_date = 8; // 发货日期, 格式: 2023-01-01,可选。 默认 2035-12-31
  repeated MaterialTransferItem items = 9; // 材料列表,必填
}


message MaterialTransferResp {
    TransferReceipt from_receipt = 1; // 出库单
    TransferReceipt to_receipt = 2; // 入库单
    TransferReceipt audit_receipt = 3; // 审核单
}

message TransferReceipt {
  string po_no = 1; // 采购订单号
  string so_no = 2; // 销售订单号
  string from_company_abbr = 3; // 调出方公司缩写
  string to_company_abbr = 4; // 调入方公司缩写
}

message MaterialTransferItem {
  string item_code = 1; // 材料编码,必填
  double qty = 2; // 数量,必填
  string uom = 3; // 单位,必填
  double rate = 4; // 单价,可选
}

service MaterialTransferService {
  // 材料调拨
  rpc MaterialTransfer (MaterialTransferReq) returns (erp.ResponseInfo);
}
