# https://goframe.org/docs/web/server-config-file-template
server:
  address: ":14021"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level: "all"
  stdout: true
  path: "./log/erp"
  #队列业务日志输出
  queue:
    level: "info"
    path: "./log/queue"

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
  link: "mysql:$DB_USERNAME:$DB_PASSWORD@tcp($DB_HOST:$DB_PORT_OPEN)/erp"

# Redis配置
redis:
  default:
    address: "$REDIS_ADDRESSES"            # Redis地址（集群模式使用逗号分隔多个地址，如：host1:port1,host2:port2,host3:port3）
    pass: "$REDIS_PASSWORD"            # 密码
    db: $REDIS_DB                          # 数据库索引
    cluster: true                          # 是否为集群模式

grpc:
  name: "ttpos-erp"
  address: ":14022"
  logPath: "./log"
  logStdout: true
  errorLogEnabled: true
  accessLogEnabled: true
  errorStack: true

nacos:
  server:
    addresses: "$NACOS_SERVER_ADDRESSES"  # 多实例配置（格式：host1:port1,host2:port2,host3:port3），优先使用
    # 兼容旧配置（单实例）
    ip: $NACOS_SERVER_IP
    port: $NACOS_SERVER_PORT
  config:
    dataId: ttpos-erp.yaml
    group: DEFAULT_GROUP

app:
  aesKey: IesahquufojahCaiceet7Pha
  serviceUrl: $ERP_SERVICE_URL
  erpnext:
    serviceUrl: $NEXTERP_SERVICE_URL
    dump: true
    webhook:
      secret: $WEBHOOK_SECRET
    core:
      pos_price_list:
        default:
          buying_price_list: "Buying - Internal"
          selling_price_list: "Selling - Internal"

# 消息队列
queue:
  switch: true                                        # 队列开关，可选：true|false，默认为true
  driver: "rocketmq"                                      # 队列驱动，可选：redis|rocketmq，默认为redis
  groupName: "ttpos-erp"                                  # mq群组名称
  poolSize: 20                                          # 消息处理线程池大小，默认20
  # redis，默认使用全局redis运行队列
  redis:
    timeout: 0                                        # 队列超时时间以秒为单位，0表示永不超时。如果队列在设定的超时时间内没有被消费，则会被销毁
  rocketmq:
    endpoint: "$ROCKETMQ_ENDPOINT"                   #代理接入点 新版v5客户端支持
    nameSrvAdders: [ $ROCKETMQ_NAME_SRV_ADDR ]        # nameSrvAdder+端口，支持多个（集群模式使用逗号分隔）
    accessKey: "$ROCKETMQ_ACCESS_KEY"                                      # 选填。如果开启了acl控制就必填
    secretKey: "$ROCKETMQ_SECRET_KEY"                                      # 选填。如果开启了acl控制就必填
    brokerAddr: "$ROCKETMQ_BROKER_ADDR"                      # brokerAddr+端口，选填。用于消费者订阅主题前会检查主题是否存在，不存在会自动创建。你也可以在rocketmq控制台手动创建主题
    retry: 3                                           # 重试次数
    logLevel: "warn"        #rocketmq 客户端输出日志级别,和logger.queue 区分开来 debug|warn|error|fatal
    invisibleDuration: 25   #invisibleDuration should > 20s
    awaitDuration: 5      # maximum waiting time for receive func
    unitName: "" # 消费者单元名称，默认使用GUID

# 调用链监控配置
otlp:
  enabled: false
  serviceName: "ttpos-erp"
  endpoint: "10.0.11.43:4318"
  path: "/v1/traces"
