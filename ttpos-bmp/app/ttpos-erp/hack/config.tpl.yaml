
# CLI tool, only in development environment.
# https://goframe.org/docs/cli
gfcli:
  gen:
    pbentity:
      link: "mysql:root:$DB_ROOT_PASSWORD@tcp($DB_HOST:$DB_PORT_OPEN)/erp"
      path: "manifest/protobuf/takeout"
      removePrefix: "erp_"
      #tables: "order,products"
      package: "erp"
    pb:
      api: "api"
      ctrl: "internal/controller/rpc"
    dao:
      - link: "mysql:root:$DB_ROOT_PASSWORD@tcp($DB_HOST:$DB_PORT_OPEN)/erp"
        descriptionTag: true
        removePrefix: "erp_"

  run:
    path: "./bin"
    extra: ""
    args: "all"
    watchPaths:
      - api/*.go
      - internal/*.go
  docker:
    build: "-a amd64 -s linux -p temp -ew"
    tagPrefixes:
      - hub.hitosea.com/ttpos-bmp-erp