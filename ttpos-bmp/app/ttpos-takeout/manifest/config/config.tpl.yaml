# https://goframe.org/docs/web/server-config-file-template
server:
  address:     ":14031"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  serverAgent:         "Ttpos Takeout Server" # 服务端Agent信息。默认
  # 日志基本配置
  # 此配置类似nginx，主要对请求日志的记录
  logPath: "./log/takeout"
  logStdout: false
  errorStack: true
  errorLogEnabled: true
  errorLogPattern: "error.{Ymd}.log"
  accessLogEnabled: false
  accessLogPattern: "access.{Ymd}.log"

# https://goframe.org/docs/core/glog-config
logger:
  level : "all"
  stdout: true
  path: "./log/takeout"

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    link: "mysql:$DB_USERNAME:$DB_PASSWORD@tcp($DB_HOST:$DB_PORT_OPEN)/takeout?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s"
    maxIdle: 10                 # (可选)连接池最大闲置的连接数(默认10)
    maxOpen: 100                # (可选)连接池最大打开的连接数(默认无限制)
    maxLifetime: "30s"          # (可选)连接对象可重复使用的时间长度(默认30秒)
    queryTimeout: "0"           # (可选)查询语句超时时长(默认无限制，同时受ctx超时时间影响)。值为time.Parse支持的格式，如30s, 1m。
    execTimeout: "0"            # (可选)写入语句超时时长(默认无限制，同时受ctx超时时间影响)。值为time.Parse支持的格式，如30s, 1m。
    tranTimeout: "0"            # (可选)事务处理超时时长(默认无限制，同时受ctx超时时间影响)。值为time.Parse支持的格式，如30s, 1m。
    prepareTimeout: "0"         # (可选)预准备SQL语句执行超时时长(默认无限制，同时受ctx超时时间影响)。值为time.Parse支持的格式，如30s, 1m。

grpc:
  name:            "ttpos-takeout"
  address:            ":14032"
  logPath:          "./log"
  logStdout:        true
  errorLogEnabled:  true
  accessLogEnabled: true
  errorStack:       true

nacos:
  server:
    addresses: "$NACOS_SERVER_ADDRESSES"  # 多实例配置（格式：host1:port1,host2:port2,host3:port3），优先使用
    # 兼容旧配置（单实例）
    ip: $NACOS_SERVER_IP
    port: $NACOS_SERVER_PORT
  config:
    dataId: ttpos-bmp.takeout.yaml
    group: DEFAULT_GROUP

app:
  serviceUrl: $TAKEOUT_SERVICE_URL
  # 换成 jwt的密钥
  callbackSecret:  $JWT_SECRET
  # TTPOS 主模块地址，用于回退调用菜单导出接口
  ttposEndpoint: $TTPOS_MAIN_ENDPOINT
  # TTPOS HTTP Client 配置
  ttpos-client:
    dump: false  # 是否打印请求/响应详情
  provider:
    skootar:
      endpoint: $SKOOTAR_ENDPOINT
      username: $SKOOTAR_USERNAME
      apiKey: $SKOOTAR_API_KEY
      channel: $SKOOTAR_CHANNEL
    grab:
      platform: #请求平台时使用
        clientId: "$GRAB_PLATFORM_CLIENT_ID"
        clientSecret: "$GRAB_PLATFORM_CLIENT_SECRET"
        secretKey: "$GRAB_PLATFORM_SECRET_KEY"  # Webhook 签名密钥
        environment: "$GRAB_ENV"  # production 或 staging
        timeout: "30s"
      partner: #请求合作伙伴时使用
        $GRAB_PARTNER_DEFAULT_CLIENT_ID:
          clientId: "$GRAB_PARTNER_DEFAULT_CLIENT_ID"
          clientSecret: "$GRAB_PARTNER_DEFAULT_CLIENT_SECRET"
          scope: "food.partner_api"     # 未配置时逻辑默认 food.partner_api
          environment: "$GRAB_ENV"        # production 或 staging
          timeout: "60s"
    lineman:
      platform:
        clientId: "$LINEMAN_PLATFORM_CLIENT_ID"
        clientSecret: "$LINEMAN_PLATFORM_CLIENT_SECRET"
        secretKey: "$LINEMAN_PLATFORM_SECRET_KEY"  # JWT 签名密钥
        endpoint: "$LINEMAN_PLATFORM_ENDPOINT"  # API 端点地址，staging: https://beta-partner-order.wndv.co
        environment: "$LINEMAN_ENV"  # production 或 staging
        timeout: "30s"
      partner: #请求合作伙伴时使用
        $LINEMAN_PARTNER_DEFAULT_CLIENT_ID:
          clientId: "$LINEMAN_PARTNER_DEFAULT_CLIENT_ID"
          clientSecret: "$LINEMAN_PARTNER_DEFAULT_CLIENT_SECRET"
          environment: "$LINEMAN_ENV"  # production 或 staging
          timeout: "60s"


queue:
  switch: true                                        # 队列开关，可选：true|false，默认为true
  driver: "rocketmq"                                      # 队列驱动，可选：redis|rocketmq
  groupName: "ttpos-takeout"
  poolSize: 20                                          # 消息处理线程池大小，默认20
  rocketmq:
    endpoint: "$ROCKETMQ_ENDPOINT"                   #代理接入点 新版v5客户端支持
    nameSrvAdders: [ $ROCKETMQ_NAME_SRV_ADDR ]        # nameSrvAdder+端口，支持多个（集群模式使用逗号分隔）
    accessKey: "$ROCKETMQ_ACCESS_KEY"                                      # 选填。如果开启了acl控制就必填
    secretKey: "$ROCKETMQ_SECRET_KEY"                                      # 选填。如果开启了acl控制就必填
    brokerAddr: "$ROCKETMQ_BROKER_ADDR"                      # brokerAddr+端口，选填。用于消费者订阅主题前会检查主题是否存在，不存在会自动创建。你也可以在rocketmq控制台手动创建主题
    retry: 3                                           # 重试次数
    logLevel: "warn"        #rocketmq 客户端输出日志级别,和logger.queue 区分开来 debug|warn|error|fatal
    invisibleDuration: 25   #invisibleDuration should > 20s
    awaitDuration: 5      # maximum waiting time for receive func

cache:
  adapter: "redis"

# database/gredis/gredis_config.go:22
redis:
  default:
    address: "$REDIS_ADDRESSES"
    pass: "$REDIS_PASSWORD"
    db: "$REDIS_DB"
    cluster: true

# 调用链监控配置
otlp:
  enabled: false
  serviceName: "ttpos-erp"
  endpoint: "10.0.11.43:4318"
  path: "/v1/traces"
