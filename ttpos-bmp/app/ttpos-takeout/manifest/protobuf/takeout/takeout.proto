syntax = "proto3";
package takeout;
option go_package = "ttpos-bmp/app/ttpos-takeout/api/takeout";

message Address {
  string addressName = 1;
  string address = 2;
  string lat = 3;
  string lng = 4;
}

message Location {
  string addressName = 1; // 地址名称
  string address = 2;  // 详细地址
  string lat = 3;      // 纬度
  string lng = 4;      // 经度
  string contactName = 5; // 联系人
  string contactPhone = 6; // 联系电话
}

message ResponseInfo {
  string code = 1;
  string message = 2;
}

message EstimateDistanceReq {
  string providerName = 1; // 外送渠道：skootar、grab
  repeated Address address = 2;
}

message EstimateDistanceResp {
  ResponseInfo responseInfo = 1;
  double distance = 2;
  int32 tripDuration = 3;
}

message CreateOrderReq {
  string providerName = 1;           // 外送渠道：skootar、grab
  Location customer_location = 2;    // 客户位置信息
  Location merchant_location = 3;    // 商家位置信息
  string remark = 4;                 // 备注
  string callback_url = 5;           // 客户端回调地址
  string shop_order_uuid =6; //商家订单号
}

message CreateOrderResp {
  ResponseInfo responseInfo = 1;
  string takeout_job_uuid = 2;   // 外送订单号
  string status = 3;                 // 0 - Canceled 已取消; 1 - New 新订单; 2 - Under review 正在审核中; 3 - Mission created 审核通过; 4 - Matching 正在匹配司机; 5 - Assigned 已分配司机; 6 - OTW to pickup 正在前往取货; 7 - OTW to delivery 正在前往送货; 8 - Pending 等待修改; 9 - Completed 已完成; 1 -  Invoice Created 已生成发票; 1 -  Paid 已支付服务费;
  string shop_order_uuid =4; //餐馆下单uuid
  string takeout_ref_no =5; //外送协调返回订单号
  string finish_time = 6; //预计送达时间
}

message ConfirmOrderReq {
  string shop_order_uuid = 1;  // ttpos 订单Uuid
}

message ConfirmOrderResp {
  ResponseInfo responseInfo = 1;
}

message GetDriverInfoReq {
  string shop_order_uuid = 1;     // ttpos 订单Uuid
}

message GetDriverInfoResp {
  ResponseInfo responseInfo = 1;
  string name = 2; // 骑手名称
  string phone = 3; // 骑手电话
  string avatar = 4; // 骑手头像
  double rating = 5; // 骑手评分
  double lat = 6;      // 纬度
  double lng = 7;      // 经度
}


message CancelOrderReq {
  string shop_order_uuid = 1;     // ttpos 订单Uuid
  string reason = 2; // 取消原因
}

message CancelOrderResp {
  ResponseInfo responseInfo = 1;
}

message GetMenuSnapshotReq {
  string provider_name = 1; // 渠道名称: grab,lineman
  string shop_uuid = 2;     // 店铺 UUID
  string request_id = 3;    // 请求 ID,可选
}

message GetMenuSnapshotResp {
  ResponseInfo responseInfo = 1;
  string content = 2;          // Provider 侧原始菜单 JSON
  int64 updated_at = 3;        // 快照更新时间
  string sync_state = 4;       // 同步状态
}

service TakeoutService {
  rpc EstimateDistance (EstimateDistanceReq) returns (EstimateDistanceResp) {}
  rpc CreateOrder (CreateOrderReq) returns (CreateOrderResp) {}
  rpc CancelOrder (CancelOrderReq) returns (CancelOrderResp) {}
  rpc ConfirmOrder (ConfirmOrderReq) returns (ConfirmOrderResp) {}
  rpc GetDriverInfo(GetDriverInfoReq) returns (GetDriverInfoResp) {}
  rpc GetMenuSnapshot (GetMenuSnapshotReq) returns (GetMenuSnapshotResp) {}
}