# TTPOS SonarQube Configuration
# ==============================
# Run: sonar-scanner -Dsonar.login=$SONAR_TOKEN

# Project identification
sonar.projectKey=ttpos-server-go
sonar.projectName=TTPOS Server Go
sonar.projectVersion=1.0

# Source code locations
sonar.sources=main
sonar.tests=main

# Test file patterns
sonar.test.inclusions=**/*_test.go

# Exclusions
# - Generated code (dao, entity, pb)
# - Test utilities (testlib)
# - Configuration files
sonar.coverage.exclusions=\
  **/dao/**,\
  **/entity/**,\
  **/pb/**,\
  **/testlib/**,\
  **/config/**,\
  **/dto/**,\
  **/model/**,\
  **/*_gen.go

sonar.exclusions=\
  **/testlib/**,\
  **/docs/**,\
  **/*.md,\
  **/*.sql

# Go specific settings
# Note: Use sonar.go.coverage.reportPaths for native Go coverage format (not sonar.coverageReportPaths which expects XML)
sonar.go.coverage.reportPaths=coverage/total.out

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis scope
sonar.scm.revision=${GIT_COMMIT}
sonar.scm.provider=git

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplication
sonar.cpd.exclusions=\
  **/dto/**,\
  **/model/**,\
  **/entity/**

# Go test report (if using gotestsum)
# sonar.go.tests.reportPaths=test-report.json
