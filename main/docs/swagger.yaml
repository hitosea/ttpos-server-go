host: 127.0.0.1:8081
info:
  contact: {}
  description: 点餐系统服务端接口文档
  title: ttpos-server-go API
  version: "1.0"
paths:
  /assistant/base:
    get:
      consumes:
      - application/json
      description: 基本信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.AssistantBase'
              type: object
      security:
      - JwtToken: []
      summary: 基本信息
      tags:
      - 点餐助手端.基础信息
  /assistant/bind_cashier:
    post:
      consumes:
      - application/json
      description: 绑定收银机
      parameters:
      - description: 绑定收银机参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.BindCashierReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - JwtToken: []
      summary: 绑定收银机
      tags:
      - 点餐助手端.认证鉴权
  /assistant/buffet/list:
    get:
      consumes:
      - application/json
      description: 获取自助餐列表
      produces:
      - application/json
      responses:
        "200":
          description: 自助餐列表
          schema:
            $ref: '#/definitions/resp.BuffetListPaginationResp'
        "404":
          description: 未找到
      security:
      - JwtToken: []
      summary: 获取自助餐列表
      tags:
      - 点餐助手端.自助餐
  /assistant/call/processed:
    post:
      consumes:
      - application/json
      description: 处理呼叫
      parameters:
      - description: 处理呼叫参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.ProcessedCallReq'
      produces:
      - application/json
      responses: {}
      security:
      - JwtToken: []
      summary: 处理呼叫
      tags:
      - 点餐助手端.呼叫
  /assistant/call/unprocessed:
    get:
      consumes:
      - application/json
      description: 获取未处理消息数量
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.UnprocessedResp'
              type: object
      security:
      - JwtToken: []
      summary: 获取未处理消息数量
      tags:
      - 点餐助手端.呼叫
  /assistant/call/unprocessed/list:
    get:
      consumes:
      - application/json
      description: 未处理呼叫列表
      parameters:
      - description: 页码
        in: query
        name: page_no
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.UnprocessedCallList'
