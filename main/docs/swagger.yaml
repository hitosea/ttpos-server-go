        type: string
      finishedTime:
        description: 完成时间
        type: integer
      id:
        description: 成品ID
        type: string
      name:
        description: 商品名
        type: string
      num:
        description: 商品数量
        type: integer
    type: object
  resp.SettingInfo:
    properties:
      clientVersion:
        description: 客户端版本
        type: string
      customerCallReminder:
        description: 是否开启顾客呼叫提醒
        type: boolean
      fontSize:
        description: 字体大小
        type: integer
      foodReminder:
        description: 是否开启来菜提醒
        type: boolean
      productPrint:
        description: 商品打印档口
        type: integer
      remark:
        description: 机器备注
        type: string
      serverVersion:
        description: 服务端版本
        type: string
      sn:
        description: 机器ID
        type: string
      username:
        description: 用户名
        type: string
    type: object
  resp.SpecialCategory:
    properties:
      id:
        description: 分类ID
        type: integer
      name:
        description: 分类名称
        type: string
    type: object
host: 127.0.0.1:8081
info:
  contact: {}
  description: 点餐系统服务端接口文档
  title: ttpos-server-go API
  version: "1.0"
paths:
  /admin/company:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 公司ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 删除公司
      tags:
      - 公司
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建公司参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.ParamCreateCompany'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 创建公司
      tags:
      - 公司
    put:
      consumes:
      - application/json
      parameters:
      - description: 更新公司参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.ParamUpdateCompany'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 更新公司
      tags:
      - 公司
  /cashier/bill/cancel/{id}:
    delete:
      consumes:
      - application/json
      description: 删除收银账单取消
      parameters:
      - description: 账单ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
        "400":
          description: 错误请求
      summary: 删除收银账单取消
      tags:
      - 收银端
  /cashier/bill/discount:
    post:
      consumes:
      - application/json
      description: 发布收银账单折扣
      parameters:
      - description: 折扣详情
        in: body
        name: discount
        required: true
      produces:
      - application/json
      responses:
        "201":
          description: 已创建
        "400":
          description: 错误请求
      summary: 发布收银账单折扣
      tags:
      - 收银端
  /cashier/bill/discount/{id}:
    delete:
      consumes:
      - application/json
      description: 删除收银账单折扣
      parameters:
      - description: 折扣ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
        "400":
          description: 错误请求
      summary: 删除收银账单折扣
      tags:
      - 收银端
  /cashier/bill/discount/change_price/{id}:
    post:
      consumes:
      - application/json
      description: 更改收银账单折扣价格
      parameters:
      - description: 折扣ID
        in: path
        name: id
        required: true
        type: string
      - description: 新价格
        in: body
        name: price
        required: true
        schema:
          type: number
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 更改收银账单折扣价格
      tags:
      - 收银端
  /cashier/bill/discount/gift:
    post:
      consumes:
      - application/json
      description: 发布收银账单折扣礼物
      parameters:
      - description: 礼物详情
        in: body
        name: gift
        required: true
      produces:
      - application/json
      responses:
        "201":
          description: 已创建
        "400":
          description: 错误请求
      summary: 发布收银账单折扣礼物
      tags:
      - 收银端
  /cashier/bill/discount/small_change:
    post:
      consumes:
      - application/json
      description: 发布收银账单小额变更
      parameters:
      - description: 小额变更详情
        in: body
        name: change
        required: true
      produces:
      - application/json
      responses:
        "201":
          description: 已创建
        "400":
          description: 错误请求
      summary: 发布收银账单小额变更
      tags:
      - 收银端
  /cashier/bill/order/check/{orderId}:
    get:
      consumes:
      - application/json
      description: 检查收银账单订单
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 订单详情
        "404":
          description: 未找到
      summary: 检查收银账单订单
      tags:
      - 收银端
  /cashier/bill/order/finish_payment/{orderId}:
    post:
      consumes:
      - application/json
      description: 完成收银账单订单支付
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 完成收银账单订单支付
      tags:
      - 收银端
  /cashier/bill/order/member:
    post:
      consumes:
      - application/json
      description: 添加成员到收银账单订单
      parameters:
      - description: 成员详情
        in: body
        name: member
        required: true
      produces:
      - application/json
      responses:
        "201":
          description: 已创建
        "400":
          description: 错误请求
      summary: 添加成员到收银账单订单
      tags:
      - 收银端
  /cashier/bill/order/member/{memberId}:
    delete:
      consumes:
      - application/json
      description: 删除收银账单订单中的成员
      parameters:
      - description: 成员ID
        in: path
        name: memberId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
        "400":
          description: 错误请求
      summary: 删除收银账单订单中的成员
      tags:
      - 收银端
  /cashier/bill/order/pay/{orderId}:
    post:
      consumes:
      - application/json
      description: 收银账单订单支付
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 收银账单订单支付
      tags:
      - 收银端
  /cashier/bill/order/payment_small_change_strategy:
    post:
      consumes:
      - application/json
      description: 处理收银账单订单的小额支付策略
      parameters:
      - description: 小额支付策略详情
        in: body
        name: strategy
        required: true
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 收银账单订单的小额支付策略
      tags:
      - 收银端
  /cashier/bill/order/printer/invoice/{orderId}:
    post:
      consumes:
      - application/json
      description: 打印收银账单订单发票
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 打印收银账单订单发票
      tags:
      - 收银端
  /cashier/bill/order/printer/payment_bill/{orderId}:
    post:
      consumes:
      - application/json
      description: 打印收银账单订单支付账单
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 打印收银账单订单支付账单
      tags:
      - 收银端
  /cashier/bill/order/printer/pre_payment_bill/{orderId}:
    post:
      consumes:
      - application/json
      description: 打印收银账单订单预付款账单
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 打印收银账单订单预付款账单
      tags:
      - 收银端
