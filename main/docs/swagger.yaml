      is_auto_voice:
        description: 是否开启自动接单语音播报
        type: string
      is_open_cashier_password:
        description: 是否开启钱箱密码 0-关闭 1-开启
        type: string
      is_remain_color:
        description: 是否开启剩余时长颜色 0-关闭 1-开启
        type: string
      is_show_assistant_sold_out:
        description: 点餐助手是否显示售罄商品 0-不显示 1-显示
