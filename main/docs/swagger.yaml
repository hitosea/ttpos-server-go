basePath: /
definitions:
  cashier_resp.Product:
    properties:
      attribute_groups:
        allOf:
        - $ref: '#/definitions/cashier_resp.ProductAttributeGroupList'
        description: 商品属性组
      category_uuid:
        description: 商品类别UUID
        type: integer
      flavors:
        allOf:
        - $ref: '#/definitions/cashier_resp.ProductFlavorList'
        description: 商品规格
      image:
        description: 商品图片
        type: string
      limit_num:
        description: 商品限购数量
        type: integer
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品名称
      price:
        description: 商品价格
        type: number
      sauces:
        allOf:
        - $ref: '#/definitions/cashier_resp.ProductSauceList'
        description: 商品小料
      special_category_uuid:
        description: 商品特殊类别UUID
        type: integer
      unit:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品单位
      uuid:
        description: 商品UUID
        type: integer
    type: object
  cashier_resp.ProductAttributeGroup:
    properties:
      attributes:
        allOf:
        - $ref: '#/definitions/cashier_resp.ProductAttributeValueList'
        description: 商品属性值列表
      is_must:
        description: 是否必选
        type: boolean
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品属性组名称
      max_select:
        description: 最大可选数量
        type: integer
      uuid:
        description: 商品属性组UUID
        type: integer
    type: object
  cashier_resp.ProductAttributeGroupList:
    properties:
      list:
        items:
          $ref: '#/definitions/cashier_resp.ProductAttributeGroup'
        type: array
    type: object
  cashier_resp.ProductAttributeValue:
    properties:
      is_default_selected:
        description: 是否默认选中
        type: boolean
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品属性名称
      uuid:
        description: 商品属性UUID
        type: integer
    type: object
  cashier_resp.ProductAttributeValueList:
    properties:
      list:
        items:
          $ref: '#/definitions/cashier_resp.ProductAttributeValue'
        type: array
    type: object
  cashier_resp.ProductCategory:
    properties:
      children:
        allOf:
        - $ref: '#/definitions/cashier_resp.ProductCategoryListResp'
        description: 子级类别
      is_special:
        description: 是否特殊类别
        type: boolean
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品类别名称
      parent_uuid:
        description: 父级类别UUID
        type: integer
      uuid:
        description: 商品类别UUID
        type: integer
    type: object
  cashier_resp.ProductCategoryListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/cashier_resp.ProductCategory'
        type: array
    type: object
  cashier_resp.ProductFlavor:
    properties:
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品规格名称
      price:
        description: 商品规格价格
        type: number
      stock_num:
        description: 商品库存数量
        type: integer
      uuid:
        description: 商品规格UUID
        type: integer
    type: object
  cashier_resp.ProductFlavorList:
    properties:
      list:
        items:
          $ref: '#/definitions/cashier_resp.ProductFlavor'
        type: array
    type: object
  cashier_resp.ProductListWithPaginationResp:
    properties:
      list:
        items:
          $ref: '#/definitions/cashier_resp.Product'
        type: array
      meta:
        $ref: '#/definitions/dto.PageResponse'
    type: object
  cashier_resp.ProductSauce:
    properties:
      is_default_selected:
        description: 是否默认选中
        type: boolean
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品小料名称
      price:
        description: 商品小料价格
        type: number
      stock_num:
        description: 小料库存数量
        type: integer
      uuid:
        description: 商品小料UUID
        type: integer
    type: object
  cashier_resp.ProductSauceList:
    properties:
      is_must:
        description: 是否必选小料
        type: boolean
      list:
        items:
          $ref: '#/definitions/cashier_resp.ProductSauce'
        type: array
      max_select:
        description: 小料最大可选数量
        type: integer
    type: object
  dto.LanguageItem:
    properties:
      key:
        type: integer
      name:
        type: string
      value:
        type: string
    type: object
  dto.LocaleResponse:
    properties:
      en:
        description: 英语
        type: string
      ja:
        description: 日语
        type: string
      ko:
        description: 韩语
        type: string
      my:
        description: 缅甸语
        type: string
      th:
        description: 泰语
        type: string
      tr:
        description: 土耳其语
        type: string
      zh:
        description: 中文
        type: string
      zhtw:
        description: 粤语
        type: string
    type: object
  dto.PageResponse:
    properties:
      page_no:
        description: 当前页码
        type: integer
      page_size:
        description: 每页大小
        type: integer
      total:
        description: 总数
        type: integer
    type: object
  dto.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  req.AddMemberReq:
    properties:
      level_uuid:
        description: 会员等级Uuid
        type: integer
      nickname:
        description: 昵称
        maxLength: 50
        type: string
      password:
        description: 密码
        maxLength: 16
        minLength: 4
        type: string
      phone:
        description: 手机号
        maxLength: 20
        type: string
    required:
    - level_uuid
    - phone
    type: object
  req.AddProductRemarkRequest:
    properties:
      order_product_id:
        description: 商品ID
        type: integer
      remark:
        description: 备注
        type: string
    type: object
  req.AddSoldOutReq:
    properties:
      sold_out_data:
        description: 设置售罄数据
        items:
          $ref: '#/definitions/req.SoldOutItem'
        type: array
    required:
    - sold_out_data
    type: object
  req.BindCashierReq:
    properties:
      cashier_uuid:
        description: 收银员Uuid
        type: integer
      device_id:
        description: 收银机设备ID
        type: string
    required:
    - device_id
    type: object
  req.BuffetCustomerType:
    properties:
      customer_type_id:
        description: 自助餐顾客类型ID
        type: integer
      name_text:
        description: 自助餐顾客类型名称
        type: string
      num:
        description: 顾客数量
        type: integer
    type: object
  req.CancelSoldOutReq:
    properties:
      product_bom_uuid:
        description: 商品规格Uuid
        type: integer
    required:
    - product_bom_uuid
    type: object
  req.CheckMemberPasswordReq:
    properties:
      member_uuid:
        description: 会员 Uuid
        type: integer
      password:
        description: 会员密码
        maxLength: 16
        minLength: 4
        type: string
      sale_bill_uuid:
        description: 销售账单 Uuid
        type: integer
      sale_order_uuid:
        description: 销售订单 Uuid
        type: integer
    required:
    - member_uuid
    type: object
  req.ConfirmRechargeOrder:
    properties:
      member_uuid:
        description: 会员Uuid
        type: integer
      recharge_order_uuid:
        description: 充值订单Uuid
        type: integer
    type: object
  req.DeskBuffetCustomerType:
    properties:
      meal_num:
        description: 就餐人数
        type: integer
      uuid:
        description: 自助餐顾客类型uuid
        type: integer
    type: object
  req.DeskOrderCreateReq:
    properties:
      buffet_customer_types:
        description: '自助餐顾客类型列表: 非自助餐时, 传空数组; 自助餐时, 元素数量最小为1'
        items:
          $ref: '#/definitions/req.DeskBuffetCustomerType'
        type: array
      buffet_uuids:
        description: '自助餐uuid列表: 非自助餐时, 传空数组; 自助餐时, 元素数量最小为1, 最大为2'
        items:
          type: integer
        type: array
      desk_uuid:
        description: 桌台uuid, 必填
        type: integer
      is_buffet:
        description: '是否是自助餐: false-否, true-是'
        type: boolean
      meal_num:
        description: '就餐人数: 非自助餐时, 最小为0, 最大为999, 自助餐时为0'
        type: integer
      remark:
        description: '备注: 最小空字符串,最大50字符'
        type: string
    type: object
  req.InstantOrderMustPlanConfirmReq:
    properties:
      sale_bill_uuid:
        description: 销售账单UUID, 必填
        type: integer
    type: object
  req.InstantOrderPaymentCreateReq:
    properties:
      payment_amount:
        description: 支付金额, 必填
        type: number
      payment_method_uuid:
        description: 支付方式UUID, 必填
        type: integer
      sale_bill_uuid:
        description: 销售账单UUID, 必填
        type: integer
      sale_order_uuid:
        description: 销售订单UUID, 必填
        type: integer
    type: object
  req.InstantOrderSaleOrderCreateReq:
    properties:
      sale_bill_uuid:
        description: 销售账单UUID, 必填
        type: integer
    type: object
  req.InstantOrderSaleOrderDeleteReq:
    properties:
      sale_bill_uuid:
        description: 销售账单UUID, 必填
        type: integer
      sale_order_uuid:
        description: 销售订单UUID, 必填
        type: integer
    type: object
  req.InstantOrderSaleOrderMoveProductReq:
    properties:
      from:
        description: 来源销售订单UUID, 必填
        type: integer
      products:
        description: 移动商品, 必填
        items:
          $ref: '#/definitions/req.MoveProduct'
        type: array
      sale_bill_uuid:
        description: 销售账单UUID, 必填
        type: integer
      to:
        description: 目标销售订单UUID, 必填
        type: integer
    type: object
  req.LoginReq:
    properties:
      brand:
        description: 品牌名称
        type: string
      code:
        description: 验证码
        type: string
      device_id:
        description: 设备ID
        type: string
      password:
        description: 密码
        type: string
      username:
        description: 用户名
        type: string
    required:
    - code
    - device_id
    - password
    - username
    type: object
  req.MoveProduct:
    properties:
      num:
        description: 移动数量, 必填
        type: integer
      uuid:
        description: 销售订单商品UUID, 必填
        type: integer
    type: object
  req.OpenDeskRequest:
    properties:
      buffet_customer_type:
        description: 自助餐顾客类型
        items:
          $ref: '#/definitions/req.BuffetCustomerType'
        type: array
      buffet_ids:
        description: 自助餐ID
        items:
          type: integer
        type: array
      is_buffet:
        description: 是否是餐桌
        type: integer
      meal_num:
        description: 顾客数量
        type: integer
    type: object
  req.OrderCancelReq:
    properties:
      cancel_reason:
        description: 取消原因
        type: string
      password:
        description: 高级密码 后台开启的时候才传
        type: string
      sale_bill_uuid:
        description: 销售账单UUID
        type: integer
    type: object
  req.OrderCartProductAddReq:
    properties:
      attribute_uuid:
        description: 规格ID
        items:
          type: integer
        type: array
      flavor_uuid:
        description: 某个规格商品ID
        type: integer
      sale_bill_uuid:
        description: 销售账单ID。可选，参数不填时表示要新建销售账单，添加商品后创建点餐销售账单。
        type: integer
      sale_order_uuid:
        description: 销售订单ID。可选，参数不填时默认加购到第一个销售订单中
        type: integer
      sauce_uuid:
        description: 小料ID
        items:
          type: integer
        type: array
    type: object
  req.OrderCartProductCookingReq:
    properties:
      sale_bill_uuid:
        description: 销售账单ID
        type: integer
      sale_order_uuid:
        description: 销售订单ID
        type: integer
    type: object
  req.OrderCartProductNumReq:
    properties:
      num:
        description: 数量
        type: integer
      sale_bill_uuid:
        description: 销售账单ID
        type: integer
      sale_order_product_uuid:
        description: 销售订单商品ID
        type: integer
      sale_order_uuid:
        description: 销售订单ID
        type: integer
    type: object
  req.OrderChangePopulationReq:
    properties:
      population:
        description: 人数
        type: integer
      sale_bill_uuid:
        description: 销售账单UUID
        type: integer
    required:
    - population
    - sale_bill_uuid
    type: object
  req.OrderDeleteReq:
    properties:
      sale_bill_uuid:
        description: 销售账单UUID
        type: integer
      sale_order_uuid:
        description: 销售订单UUID 传0的时候默认删除主单以及所有子单，不然只删除子单
        type: integer
    type: object
  req.OrderProductChangePriceReq:
    properties:
      order_product_uuid:
        description: 订单商品UUID
        type: integer
      price:
        description: 改价
        type: number
      sale_bill_uuid:
        description: 销售账单UUID
        type: integer
      sale_order_uuid:
        description: 销售订单UUID
        type: integer
    required:
    - order_product_uuid
    - price
    - sale_bill_uuid
    - sale_order_uuid
    type: object
  req.OrderProductDeleteReq:
    properties:
      order_product_uuid:
        description: 订单商品UUID
        type: integer
      sale_bill_uuid:
        description: 销售账单UUID
        type: integer
      sale_order_uuid:
        description: 销售订单UUID
        type: integer
    required:
    - order_product_uuid
    - sale_bill_uuid
    - sale_order_uuid
    type: object
  req.OrderProductRemarkReq:
    properties:
      order_product_uuid:
        description: 订单商品UUID
        type: integer
      remark:
        description: remark
        type: string
      sale_bill_uuid:
        description: 销售账单UUID
        type: integer
      sale_order_uuid:
        description: 销售订单UUID
        type: integer
    required:
    - order_product_uuid
    - sale_bill_uuid
    - sale_order_uuid
    type: object
  req.PrintRechargeOrderReq:
    properties:
      print_lang:
        description: 打印语言
        type: string
      recharge_order_uuid:
        description: 充值订单Uuid
        type: integer
    required:
    - recharge_order_uuid
    type: object
  req.PrinterLogReq:
    properties:
      uuid:
        description: 打印日志Uuid
        type: integer
    required:
    - uuid
    type: object
  req.ProcessedCallReq:
    properties:
      uuid:
        type: integer
    required:
    - uuid
    type: object
  req.RechargeOrderAddPaymentMethodReq:
    properties:
      payment_amount:
        description: 支付金额，使用现金支付，可能大于充值金额，比如充值19，但是会员给了20
        minimum: 0.01
        type: number
      payment_method_uuid:
        description: 支付方式Uuid
        type: integer
      recharge_order_uuid:
        description: 充值订单Uuid
        type: integer
    required:
    - payment_amount
    - payment_method_uuid
    - recharge_order_uuid
    type: object
  req.RechargeOrderCancelPaymentMethodReq:
    properties:
      payment_order_uuid:
        description: 支付订单Uuid
        type: integer
      recharge_order_uuid:
        description: 充值订单Uuid
        type: integer
    required:
    - payment_order_uuid
    - recharge_order_uuid
    type: object
  req.RechargeReq:
    properties:
      gift_amount:
        description: 赠送金额
        minimum: 0
        type: number
      gift_point:
        description: 赠送积分
        minimum: 0
        type: number
      member_uuid:
        description: 会员Uuid
        type: integer
      recharge_amount:
        description: 充值金额
        minimum: 1
        type: number
      recharge_order_uuid:
        description: 进行中的充值订单，如果没有进行中的充值订单，传递0
        type: integer
    required:
    - member_uuid
    - recharge_amount
    type: object
  req.SoldOutItem:
    properties:
      is_sold_out:
        description: 是否售罄：true-是；false-否
        type: boolean
      product_bom_uuid:
        description: 商品规格Uuid
        type: integer
    required:
    - is_sold_out
    - product_bom_uuid
    type: object
  req.UpdateAcceptOrderSetting:
    properties:
      auto_order_limit:
        description: 自动接单金额上限，0.01-100000000
        type: string
      is_auto_order:
        description: 是否自动接单：0-否；1-是
        enum:
        - "0"
        - "1"
        type: string
    required:
    - is_auto_order
    type: object
  req.UpdateSystemSetting:
    properties:
      dish_card_style:
        description: 菜品卡片样式 0-无图模式 1-图片模式
        enum:
        - "0"
        - "1"
        type: string
      is_show_assistant_sold_out:
        description: 助手端点餐助手是否显示售罄商品 0-不显示 1-显示
        enum:
        - 0
        - 1
        type: integer
      is_show_scan_sold_out:
        description: 扫码点餐端是否显示售罄商品 0-关闭（不显示售罄） 1-开启（显示售罄）
        enum:
        - 0
        - 1
        type: integer
      is_show_sold_out:
        description: 平板端是否显示售罄商品 0-关闭（不显示售罄） 1-开启（显示售罄）
        enum:
        - 0
        - 1
        type: integer
      menu_show_sold_out:
        description: 电子菜单是否显示售罄商品 0-关闭（不显示售罄） 1-开启（显示售罄）
        enum:
        - "0"
        - "1"
        type: string
    required:
    - dish_card_style
    - is_show_assistant_sold_out
    - is_show_scan_sold_out
    - is_show_sold_out
    - menu_show_sold_out
    type: object
  req.VerifyPasswordReq:
    properties:
      password:
        description: 密码
        type: string
    required:
    - password
    type: object
  resp.AbnormalPrintItem:
    properties:
      create_time:
        description: 创建时间
        type: integer
      desk_no:
        description: 桌台编号
        type: string
      printer_name:
        description: 打印时间
        type: string
      printer_uuid:
        description: 打印机Uuid
        type: integer
      reason:
        description: 异常原因
        type: string
      sale_bill_uuid:
        description: 销售账单uuid
        type: integer
      uuid:
        description: 打印日志Uuid
        type: integer
    type: object
  resp.AbnormalPrintList:
    properties:
      list:
        description: 异常打印列表
        items:
          $ref: '#/definitions/resp.AbnormalPrintItem'
        type: array
      meta:
        $ref: '#/definitions/dto.PageResponse'
    type: object
  resp.AboutBuffet:
    properties:
      is_customer:
        description: 是否是自助餐顾客
        type: boolean
      is_delay:
        description: 是否是加钟
        type: boolean
    type: object
  resp.AcceptOrderSetting:
    properties:
      auto_order_limit:
        description: 自动接单金额上限，0.01-100000000
        type: string
      is_auto_order:
        description: 是否自动接单：0-否；1-是
        type: string
      is_auto_voice:
        description: 是否开启自动接单语音播报 0-否；1-是
        type: string
    type: object
  resp.Ads:
    properties:
      list:
        items:
          $ref: '#/definitions/setting.CarouselItem'
        type: array
    type: object
  resp.AmountInfo:
    properties:
      amount:
        description: 总金额。商品未含税时，总金额=商品金额(折后)+服务费+税费。商品已含税时，总金额=商品金额（折后，含商品消费税）+服务费+税费（只有服务费税）
        type: number
      discount_amount:
        description: 优惠折扣金额(整单打折优惠金额+订单抹零金额)
        type: number
      member_discount_amount:
        description: 会员优惠折扣金额
        type: number
      product_amount:
        description: 商品金额(折后价)
        type: number
      product_origin_amount:
        description: 商品金额(原价)
        type: number
      service_amount:
        description: 服务费
        type: number
      tax_amount:
        description: 税费（商品税费+服务费税费）
        type: number
    type: object
  resp.AssistantBase:
    properties:
      assistant_uuid:
        description: 点餐助手员工UUID
        type: integer
      username:
        description: 登录账号
        type: string
    type: object
  resp.Attribute:
    properties:
      is_default_selected:
        description: 是否默认选中
        type: boolean
      locale_name:
        allOf:
        - $ref: '#/definitions/dto.LocaleResponse'
        description: 商品属性名称
      uuid:
