info:
  contact: {}
  description: 点餐系统服务端接口文档
  title: ttpos-server-go API
  version: "1.0"
paths:
  /assistant/desk/info:
    get:
      consumes:
      - application/json
      description: 获取桌台详情
      produces:
      - application/json
      responses:
        "200":
          description: 桌台详情
        "404":
          description: 未找到
      summary: 获取桌台详情
      tags:
      - 点餐助手端
  /assistant/desk/list:
    get:
      consumes:
      - application/json
      description: 获取桌台列表
      produces:
      - application/json
      responses:
        "200":
          description: 桌台列表
          schema:
            type: array
        "404":
          description: 未找到
      summary: 获取桌台列表
      tags:
      - 点餐助手端
  /assistant/desk/region_and_type:
    get:
      consumes:
      - application/json
      description: 获取桌台的区域和类型
      produces:
      - application/json
      responses:
        "200":
          description: 桌台区域和类型列表
          schema:
            $ref: '#/definitions/cashier_resp.DeskRegionAndTypeListWithPaginationResp'
        "404":
          description: 未找到
      summary: 获取桌台的区域和类型
      tags:
      - 点餐助手端
  /cashier/base:
    get:
      consumes:
      - application/json
      description: 收银端信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/cashier_resp.Base'
              type: object
      summary: 收银端信息
      tags:
      - 收银端
  /cashier/bill/cancel/{id}:
    delete:
      consumes:
      - application/json
      description: 删除收银账单取消
      parameters:
      - description: 账单ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
        "400":
          description: 错误请求
      summary: 删除收银账单取消
      tags:
      - 收银端
  /cashier/bill/discount:
    post:
      consumes:
      - application/json
      description: 发布收银账单折扣
      parameters:
      - description: 折扣详情
        in: body
        name: discount
        required: true
      produces:
      - application/json
      responses:
        "201":
          description: 已创建
        "400":
          description: 错误请求
      summary: 发布收银账单折扣
      tags:
      - 收银端
  /cashier/bill/discount/{id}:
    delete:
      consumes:
      - application/json
      description: 删除收银账单折扣
      parameters:
      - description: 折扣ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
        "400":
          description: 错误请求
      summary: 删除收银账单折扣
      tags:
      - 收银端
  /cashier/bill/discount/change_price/{id}:
    post:
      consumes:
      - application/json
      description: 更改收银账单折扣价格
      parameters:
      - description: 折扣ID
        in: path
        name: id
        required: true
        type: string
      - description: 新价格
        in: body
        name: price
        required: true
        schema:
          type: number
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 更改收银账单折扣价格
      tags:
      - 收银端
  /cashier/bill/discount/gift:
    post:
      consumes:
      - application/json
      description: 发布收银账单折扣礼物
      parameters:
      - description: 礼物详情
        in: body
        name: gift
        required: true
      produces:
