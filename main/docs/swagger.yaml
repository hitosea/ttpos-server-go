        name: uuid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 桌台详情
          schema:
            $ref: '#/definitions/resp.DeskInfoResp'
        "404":
          description: 未找到
      security:
      - JwtToken: []
      summary: 获取桌台详情
      tags:
      - 点餐助手端.桌台
