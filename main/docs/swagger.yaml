      parameters:
      - description: 详情参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.ChangeDeskReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "404":
          description: 未找到
      security:
      - JwtToken: []
      summary: 切换桌台
      tags:
      - 点餐助手端.桌台
  /assistant/desk/complete:
