    type: object
  resp.ServedProductHistory:
    properties:
      list:
        items:
          $ref: '#/definitions/resp.HistoryProductionOrder'
        type: array
      pageNum:
        description: 页码
        type: integer
      pageSize:
        description: 每页大小
        type: integer
      totalPage:
        description: 总页数
