    post:
      consumes:
      - application/json
      description: 取消收银账单订单的退货
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
        "400":
          description: 错误请求
      summary: 取消收银账单订单的退货
      tags:
      - 收银端
  /cashier/bill/order/production_order/finished_product/status/{orderId}:
    get:
      consumes:
      - application/json
      description: 获取收银账单订单的成品状态
      parameters:
      - description: 订单ID
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 产品状态
        "404":
          description: 未找到
      summary: 获取收银账单订单的成品状态
      tags:
      - 收银端
