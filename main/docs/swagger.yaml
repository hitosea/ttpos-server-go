info:
  contact: {}
  description: 点餐系统服务端接口文档
  title: ttpos-server-go API
  version: "1.0"
paths:
  /admin/erpnext/lianlian/payment/add:
    post:
      consumes:
      - application/json
      description: 支付方式列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 支付方式列表
      tags:
      - 平台端.支付管理
  /admin/erpnext/payment_method/add:
    post:
      consumes:
      - application/json
      description: 添加支付方式
      parameters:
      - description: 支付方式请求
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.AddPaymentMethodReq'
      - description: 支付方式请求
        in: body
        name: payment_method_req
        required: true
        schema:
          $ref: '#/definitions/req.AddPaymentMethodReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 添加支付方式
      tags:
      - 平台端.支付管理
  /admin/erpnext/payment_method/list:
    get:
      consumes:
      - application/json
      description: 获取支付方式列表
      parameters:
      - description: 公司UUID
        in: query
        name: company_uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 获取支付方式列表
      tags:
      - 平台端.支付管理
  /admin/erpnext/shop/init:
    post:
      consumes:
      - application/json
      description: 初始化店铺
      parameters:
      - description: 初始化店铺请求
        in: body
        name: init_shop_req
        required: true
        schema:
          $ref: '#/definitions/req.InitShopReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 初始化店铺
      tags:
      - 平台端.商家授权
  /admin/erpnext/shop/update_headquarter_supplier_name:
    post:
      consumes:
      - application/json
      description: 更新总部供应商名称
      parameters:
      - description: 更新总部供应商名称请求
        in: body
        name: update_headquarter_supplier_name_req
        required: true
        schema:
          $ref: '#/definitions/req.UpdateHeadquarterSupplierNameReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 更新总部供应商名称
      tags:
      - 平台端.商家授权
  /admin/erpnext/site/company:
    get:
      consumes:
      - application/json
      description: 获取ERPNext站点公司名称
      parameters:
      - description: ERPNext站点编码
        in: query
        name: site_code
        required: true
        type: string
      - description: 公司名称
        in: query
        name: company_name
        type: string
      - description: 公司缩写
        in: query
        name: company_abbr
        type: string
      - description: 父公司名称
        in: query
        name: parent_company
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.ErpnextSiteCompanyResp'
              type: object
      summary: 获取ERPNext站点公司名称
      tags:
      - 平台端.商家授权
  /assistant/base:
    get:
      consumes:
      - application/json
      description: 基本信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.AssistantBase'
              type: object
      security:
      - JwtToken: []
      summary: 基本信息
      tags:
      - 点餐助手端.基础信息
  /assistant/batch_tag/list:
    get:
      consumes:
      - application/json
      description: 获取分批类型列表，按 sort 排序，优先级高的在前
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product_resp.BatchTagList'
              type: object
      security:
      - JwtToken: []
      summary: 获取分批类型列表
      tags:
      - 点餐助手端.基础信息
  /assistant/bind_cashier:
    post:
      consumes:
      - application/json
      description: 绑定收银机
      parameters:
      - description: 绑定收银机参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.BindCashierReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
