      parameters:
      - description: '是否是自助餐: -1=全都、0=否、1=是'
        in: query
        name: is_buffet
        type: integer
      - description: 页码
        in: query
        minimum: 1
        name: page_no
        type: integer
      - description: 每页大小
        in: query
        maximum: 1000
        minimum: 1
        name: page_size
        type: integer
      - description: 桌台状态, -1=全都、 0=未开台、1=已开台, 2=已开台不等于待清台
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 桌台列表
          schema:
            items:
              $ref: '#/definitions/resp.DeskListWithPaginationResp'
            type: array
        "404":
          description: 未找到
      security:
      - JwtToken: []
      summary: 获取桌台列表
      tags:
      - 点餐助手端.桌台
