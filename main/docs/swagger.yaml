      is_open_local_print:
        description: 是否开启本地打印
        type: integer
      is_open_member:
        description: 是否开启会员
        type: integer
      is_open_scan:
        description: 是否开启扫码
        type: integer
      is_open_tablet:
        description: 是否开启平板
