    get:
      consumes:
      - application/json
      description: 获取订单列表
      parameters:
      - description: 账单类型, -1=全都、 0=Desk桌台订单、1=OrderingFood点餐订单
        in: query
        name: bill_type
        type: integer
      - description: 日期类型 -1=全都、 0=今天、 1=昨天、 2=本周
        in: query
        name: date_type
        type: integer
      - description: 用餐方式,-1=全都、 0-堂食 1-打包
        in: query
        name: dining_method
        type: integer
      - description: 启用开台时间 false-不启用，true-启用
        in: query
        name: enable_create_time
        type: boolean
      - description: 启用支付时间 false-不启用，true-启用
        in: query
        name: enable_pay_time
        type: boolean
      - description: 订单编号
        in: query
        name: order_no
        type: string
      - description: 页码
        in: query
        minimum: 1
        name: page_no
        type: integer
      - description: 每页大小
        in: query
        maximum: 1000
        minimum: 1
        name: page_size
        type: integer
      - description: 查询结束时间戳
        in: query
        name: query_end_time
        type: integer
      - description: 查询开始时间戳
        in: query
        name: query_start_time
        type: integer
      - description: 账单状态, -1=全都、 0=待付款、1=已完成、2=已取消
        in: query
        name: status
        type: integer
