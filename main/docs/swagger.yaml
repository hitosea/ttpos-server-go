    get:
      consumes:
      - application/json
      description: 检查更新
      parameters:
      - description: 品牌参数
        in: query
        name: brand
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - JwtToken: []
      summary: 检查更新
      tags:
      - 点餐助手端.基础信息
