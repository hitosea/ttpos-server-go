host: 127.0.0.1:8081
info:
  contact: {}
  description: 点餐系统服务端接口文档
  title: ttpos-server-go API
  version: "1.0"
paths:
  /assistant/base:
    get:
      consumes:
      - application/json
      description: 点餐助手端信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.AssistantBase'
              type: object
      security:
      - JwtToken: []
      summary: 点餐助手端信息
      tags:
      - 点餐助手端.认证鉴权
  /assistant/bind_cashier:
    post:
      consumes:
      - application/json
      description: 点餐助手绑定收银机
      parameters:
      - description: 登录参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - JwtToken: []
      summary: 点餐助手绑定收银机
      tags:
      - 点餐助手端.认证鉴权
  /assistant/buffet/list:
    get:
      consumes:
      - application/json
      description: 获取自助餐列表
      produces:
      - application/json
      responses:
        "200":
          description: 自助餐列表
          schema:
            $ref: '#/definitions/resp.BuffetListPaginationResp'
        "404":
          description: 未找到
      summary: 获取自助餐列表
      tags:
      - 点餐助手端.自助餐
  /assistant/desk/info:
    get:
      consumes:
      - application/json
      description: 获取桌台详情
      parameters:
      - description: 桌台uuid
        in: query
        name: uuid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 桌台详情
          schema:
            $ref: '#/definitions/resp.DeskInfoResp'
        "404":
          description: 未找到
      summary: 获取桌台详情
      tags:
      - 点餐助手端.桌台
  /assistant/desk/list:
    get:
      consumes:
      - application/json
      description: 获取桌台列表
      parameters:
      - description: 页码
        in: query
        minimum: 1
        name: page_no
        type: integer
      - description: 每页大小
        in: query
        maximum: 1000
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 桌台列表
          schema:
            items:
              $ref: '#/definitions/resp.DeskListWithPaginationResp'
            type: array
        "404":
          description: 未找到
      summary: 获取桌台列表
      tags:
      - 点餐助手端.桌台
  /assistant/desk/region_and_type:
    get:
      consumes:
      - application/json
      description: 获取桌台的区域和类型
      produces:
      - application/json
      responses:
        "200":
          description: 桌台区域和类型列表
          schema:
            $ref: '#/definitions/resp.DeskRegionAndTypeListWithPaginationResp'
        "404":
          description: 未找到
      summary: 获取桌台的区域和类型
      tags:
      - 点餐助手端.桌台
  /assistant/login:
    post:
      consumes:
      - application/json
      description: 点餐助手登录
      parameters:
      - description: 验证码sign
        in: header
        name: X-SIGN
        required: true
        type: string
      - description: 登录参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/req.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 点餐助手登录
      tags:
      - 点餐助手端.认证鉴权
  /assistant/logout:
    post:
      consumes:
      - application/json
      description: 点餐助手退出登录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - JwtToken: []
      summary: 点餐助手退出登录
      tags:
      - 点餐助手端.认证鉴权
  /assistant/online_cashiers:
    get:
      consumes:
      - application/json
      description: 获取在线收银机
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.OnlineCashierList'
              type: object
      security:
      - JwtToken: []
      summary: 获取在线收银机
      tags:
      - 点餐助手端.认证鉴权
  /cashier/ad:
    get:
      consumes:
      - application/json
      description: 收银端副屏广告
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.Ads'
              type: object
      security:
      - JwtToken: []
      summary: 收银端副屏广告
      tags:
      - 收银端.基础信息
  /cashier/base:
    get:
      consumes:
      - application/json
      description: 收银端基础信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/resp.CashierBase'
              type: object
      security:
      - JwtToken: []
      summary: 收银端基础信息
      tags:
      - 收银端.基础信息
  /cashier/bill/cancel/{id}:
    delete:
      consumes:
      - application/json
      description: 删除收银账单取消
      parameters:
      - description: 账单ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 无内容
