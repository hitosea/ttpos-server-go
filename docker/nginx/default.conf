include /etc/nginx/conf.d/conf.d/*.http;

#这里的IP是代理服务器的IP，也可以是IP段。意思是把该IP请求过来的x_forwarded_for设为remote_addr
set_real_ip_from 10.0.0.0/24;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# 上传限制
client_max_body_size 120m;
client_header_buffer_size 100k;

# 代理golang
upstream go_service {
    server golang:8080 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# websock
upstream ws_services {
    server websocket:8099 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# 
server {
    listen 80;
    server_name localhost;
    include /etc/nginx/conf.d/conf.d/*.conf;
    root /var/www/public;
    index index.html index.htm;

    location ~ ^/(admin|cashier|apidoc|shop|kitchen|tablet|home|assistant|menu)$ {
        return 301 $scheme://$http_host$request_uri/;
    }

    location ~ ^/(admin|cashier/|apidoc/|shop/|kitchen/|tablet/|home/|assistant/|menu/) {
        index index.html;
        if ($uri ~* \.html) {
            add_header Content-Type "text/html; charset=utf-8";
        }
    }
    
    location /api {
        rewrite ^/api/(.*)$ /index.php?s=/$1 last;
    }

    location /index.php {
        rewrite ^/index.php/(.*)$ /index.php?s=/$1 last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php/admin;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 代理golang
    location /api/v1 {
       try_files $uri @go_service;
    }

    location /swagger {
       try_files $uri @go_service;
    }

    location @go_service {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
        proxy_max_temp_file_size 128m;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://go_service;
    }

    # 代理WebSocket
    location /ws {
        proxy_http_version 1.1;
		proxy_connect_timeout 180s;
        proxy_send_timeout 1600s;
        proxy_read_timeout 1600s;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
        proxy_max_temp_file_size 128m;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";	
        proxy_pass http://ws_services;
	}
    location /ws/push {
       try_files $uri @ws_services;
    }
    location @ws_services {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
        proxy_max_temp_file_size 128m;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ws_services;
    }

    # 代理谷歌云存储
    location /storage_googleapis/ { 
        proxy_pass https://storage.googleapis.com/;  
        proxy_set_header Host storage.googleapis.com;  # 设置 Host 头
        proxy_set_header X-Real-IP $remote_addr;  # 将真实 IP 传递给后端
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 传递代理链中的 IP 地址

        # 添加 CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always; # 注意：'*' 表示允许所有源，根据实际需求修改
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always; # 根据实际需求添加允许的 HTTP 方法
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always; # 根据实际需求添加允许的请求头d

        # 告诉浏览器要缓存图片
        expires 365d;
        add_header Cache-Control "public, max-age=31536000"; 

        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000; # 预检结果缓存时间
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # 导出模版
    location /imports {
        root /var/www/public/;
    }

    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/x-javascript application/json application/javascript image/x-icon image/png image/gif image/jpeg image/svg+xml;
    charset utf-8;
    access_log off;
}