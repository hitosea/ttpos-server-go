include /etc/nginx/conf.d/conf.d/*.http;

#这里的IP是代理服务器的IP，也可以是IP段。意思是把该IP请求过来的x_forwarded_for设为remote_addr
set_real_ip_from 10.0.0.0/24;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# 上传限制
client_max_body_size 120m;
client_header_buffer_size 100k;

# 1.0二维码跳转
server {
    listen 80;
    server_name merchant.ttpos.com merchant.ttpos.com:80;

    root /var/www/public;
    index redirect.html;

    location / {
        try_files $uri $uri/ /redirect.html;
    }
}


# 
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/conf.d/conf.d/*.conf;
    root /var/www/public;
    index index.html index.htm;

    location ~ ^/(admin|cashier|apidoc|shop|kitchen|tablet|home|assistant|menu)$ {
        return 301 $scheme://$http_host$request_uri/;
    }

    location ~ ^/(admin|cashier/|apidoc/|shop/|kitchen/|tablet/|home/|assistant/|menu/) {
        index index.html;
        if ($uri ~* \.html) {
            add_header Content-Type "text/html; charset=utf-8";
        }
    }
    
    location /api {
        rewrite ^/api/(.*)$ /index.php?s=/$1 last;
    }

    location /index.php {
        rewrite ^/index.php/(.*)$ /index.php?s=/$1 last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php/admin;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 代理golang
    location /api/v1 {
       try_files $uri @go_service;
    }

    location /swagger {
       try_files $uri @go_service;
    }

    location /metrics {
       try_files $uri @go_service;
    }

    location @go_service {
        resolver 127.0.0.11 valid=5s;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
        proxy_max_temp_file_size 128m;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://golang:8080;
    }

    # # 代理 reconciliation_templates 服务
    # location /reconciliation-templates-webhook {
    #     resolver 127.0.0.11 valid=5s;
    #     proxy_http_version 1.1;
    #     proxy_set_header X-Real-IP $http_x_forwarded_for;
    #     proxy_set_header X-Real-PORT $remote_port;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header Scheme $scheme;
    #     proxy_set_header Server-Protocol $server_protocol;
    #     proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
    #     proxy_max_temp_file_size 128m;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_pass http://reconciliation_templates:3000/webhook;
    # }

    # 代理谷歌云存储
    location /storage_googleapis/ { 
        proxy_pass https://storage.googleapis.com/;  
        proxy_set_header Host storage.googleapis.com;  # 设置 Host 头
        proxy_set_header X-Real-IP $remote_addr;  # 将真实 IP 传递给后端
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 传递代理链中的 IP 地址
        proxy_ssl_server_name on;   # 启用 SNI 支持
        proxy_ssl_verify off;       # 关闭 SSL 验证
        proxy_connect_timeout 60s;  # 连接超时
        proxy_send_timeout 60s;     # 发送超时
        proxy_read_timeout 60s;     # 读取超时
        proxy_buffering on;         # 开启缓冲
        proxy_buffer_size 16k;      # 缓冲区大小
        proxy_buffers 16 16k;       # 缓冲区数量和大小
        # 告诉浏览器要缓存图片
        expires 365d;
        add_header Cache-Control "public, max-age=31536000"; 
    }

    # 导出模版
    location /imports {
        root /var/www/public/;
    }

    # 支付图片
    location /image/pay {
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # 添加CORS头
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
            add_header Access-Control-Max-Age "1728000";
            add_header Content-Type "text/plain charset=UTF-8";
            add_header Content-Length "0";
            return 204;
        }
        root /var/www/public/;
    }


    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/x-javascript application/json application/javascript image/x-icon image/png image/gif image/jpeg image/svg+xml;
    charset utf-8;
    #access_log on;
}