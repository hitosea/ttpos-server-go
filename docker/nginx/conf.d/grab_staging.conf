# Nginx Grab Staging Location 配置
# 用于多环境对比测试、版本验证和问题排查
# 创建日期: 2026-01-04
# 维护者: rikugun

# ⚠️ 重要提示：
# 1. 镜像请求会导致同一操作在 3 个环境同时执行
# 2. 建议只对查询类 API（GET 请求）使用此功能
# 3. 避免对 POST/PUT/DELETE 操作使用，可能导致数据污染
# 4. 非测试场景建议注释掉 mirror 指令
# 5. upstream 定义已移至 grab_staging.http 文件（http 块级别）

# Grab Staging 主请求（返回响应给客户端）
location /grab_staging/ {
    # 镜像请求到 ups1
    mirror /grab_staging_mirror_ups1;
    # 镜像请求到 ups2
    mirror /grab_staging_mirror_ups2;
    # 镜像请求异步处理，不等待响应
    mirror_request_body on;
    
    # 代理配置（主请求到 upstest - 本地服务）
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-PORT $remote_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header Server-Protocol $server_protocol;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
    proxy_max_temp_file_size 128m;
    
    # 主请求到 upstest（本地服务），移除 /grab_staging 前缀
    proxy_pass http://upstest/;
}

# 镜像请求到 ups1（内部 location）
location = /grab_staging_mirror_ups1 {
    internal;
    
    # 代理配置
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify off;  # 禁用SSL证书验证（开发/测试环境）
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 使用原始请求URI，移除 /grab_staging 前缀后转发到 ups1
    set $mirror_uri $request_uri;
    if ($mirror_uri ~ "^/grab_staging(.*)$") {
        set $mirror_uri $1;
    }
    proxy_pass https://ups1$mirror_uri;
}

# 镜像请求到 ups2（内部 location）
location = /grab_staging_mirror_ups2 {
    internal;
    
    # 代理配置
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify off;  # 禁用SSL证书验证（开发/测试环境）
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 使用原始请求URI，移除 /grab_staging 前缀后转发到 ups2
    set $mirror_uri $request_uri;
    if ($mirror_uri ~ "^/grab_staging(.*)$") {
        set $mirror_uri $1;
    }
    proxy_pass https://ups2$mirror_uri;
}

