# Nginx Grab Staging Location 配置
# 用于多环境对比测试、版本验证和问题排查
# 创建日期: 2026-01-04
# 维护者: rikugun

# ⚠️ 重要提示：
# 1. 镜像请求会导致同一操作在 3 个环境同时执行
# 2. 建议只对查询类 API（GET 请求）使用此功能
# 3. 避免对 POST/PUT/DELETE 操作使用，可能导致数据污染
# 4. 非测试场景建议注释掉 mirror 指令
# 5. upstream 定义已移至 grab_staging.http 文件（http 块级别）

# Grab Staging 主请求（返回响应给客户端）
location /grab_staging {
    # 镜像请求到 ups1
    mirror /grab_staging_mirror_ups1;
    # 镜像请求到 ups2
    mirror /grab_staging_mirror_ups2;
    # 镜像请求异步处理，不等待响应
    mirror_request_body on;
    
    # 移除 /grab_staging 前缀
    rewrite ^/grab_staging(.*)$ $1 break;
    
    # 代理配置（主请求到 upstest）
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 主请求到 upstest
    proxy_pass https://upstest;
}

# 镜像请求到 ups1（内部 location）
location = /grab_staging_mirror_ups1 {
    internal;
    
    # 移除 /grab_staging 前缀
    rewrite ^/grab_staging(.*)$ $1 break;
    
    # 代理配置
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 转发到 ups1
    proxy_pass https://ups1$request_uri;
}

# 镜像请求到 ups2（内部 location）
location = /grab_staging_mirror_ups2 {
    internal;
    
    # 移除 /grab_staging 前缀
    rewrite ^/grab_staging(.*)$ $1 break;
    
    # 代理配置
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 转发到 ups2
    proxy_pass https://ups2$request_uri;
}

