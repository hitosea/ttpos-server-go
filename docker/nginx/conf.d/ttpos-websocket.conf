# WebSocket 服务代理配置
# 用于代理 ttpos-websocket 服务的 WebSocket 连接

# WebSocket 连接代理
location /ws {
    # 注意：需要确保 nginx 容器也加入 bmp-network
    proxy_pass http://10.0.10.45:14051;
    
    # HTTP 版本配置
    proxy_http_version 1.1;
    
    # WebSocket 必需的头部
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # 基础代理头部
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 超时配置（重要：WebSocket 需要较长的超时时间）
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;      # 1小时
    proxy_read_timeout 3600s;      # 1小时
    
    # 缓冲配置
    proxy_buffering off;
    proxy_cache off;
    
    # 日志配置
    access_log /var/log/nginx/websocket_access.log;
    error_log /var/log/nginx/websocket_error.log;
}