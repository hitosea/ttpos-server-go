# WebSocket 服务代理配置
# 用于代理 ttpos-websocket 服务的 WebSocket 连接

# WebSocket 连接代理
location /ws {
    # 注意：需要确保 nginx 容器也加入 bmp-network
    proxy_pass http://10.0.10.45:14051;
    
    # HTTP 版本配置
    proxy_http_version 1.1;
    
    # WebSocket 必需的头部
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # 基础代理头部
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # 超时配置（重要：WebSocket 需要较长的超时时间）
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;      # 1小时
    proxy_read_timeout 3600s;      # 1小时
    
    # 缓冲配置
    proxy_buffering off;
    proxy_cache off;
    
    # 日志配置
    access_log /var/log/nginx/websocket_access.log;
    error_log /var/log/nginx/websocket_error.log;
}

# HTTP 推送接口
location /ws/push {
    try_files $uri @ws_services;
}
location @ws_services {
    resolver 127.0.0.11 valid=5s;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    proxy_set_header X-Real-PORT $remote_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header Server-Protocol $server_protocol;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_404;
    proxy_max_temp_file_size 128m;
    proxy_set_header Upgrade $http_upgrade;
    proxy_pass http://10.0.10.45:14051;
}