# Redis 集群节点2配置
port 6379
bind 0.0.0.0
protected-mode no

# 集群配置
cluster-enabled yes
cluster-config-file nodes-6379.conf
cluster-node-timeout 5000

# 持久化配置
appendonly yes
appendfsync everysec

# 内存配置
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志配置
loglevel notice
logfile ""

# 性能优化
tcp-keepalive 60
timeout 0
tcp-backlog 511
hz 10
dynamic-hz yes
maxclients 10000 